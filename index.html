<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebzHost — Premium Dynamic Telegram Bot Hosting</title>
    
    <!-- Google Fonts & Phosphor Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            --bg-dark: #030712;
            --bg-card: rgba(17, 24, 39, 0.6);
            --bg-card-hover: rgba(31, 41, 55, 0.7);
            --border: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(99, 102, 241, 0.4);
            
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.25);
            --cyan: #06b6d4;
            --success: #10b981;
            --danger: #f43f5e;
            --warning: #f59e0b;
            
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 18px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-primary); min-height: 100vh; overflow-x: hidden; }
        a { text-decoration: none; color: inherit; }
        button { cursor: pointer; border: none; background: none; font-family: inherit; }
        input, select, textarea { font-family: inherit; }

        .ambient-glow {
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
            width: 800px; height: 400px; background: radial-gradient(circle, rgba(99,102,241,0.15) 0%, rgba(6,182,212,0.05) 50%, rgba(0,0,0,0) 80%);
            pointer-events: none; z-index: 0; filter: blur(60px);
        }

        .glass-card {
            background: var(--bg-card); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5); transition: var(--transition);
        }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 10px 20px; border-radius: var(--radius-sm); font-weight: 500; font-size: 0.9rem;
            transition: var(--transition); border: 1px solid transparent;
        }
        .btn-primary { background: linear-gradient(135deg, var(--primary), #4f46e5); color: white; box-shadow: 0 0 20px var(--primary-glow); }
        .btn-secondary { background: rgba(255,255,255,0.05); border-color: var(--border); color: var(--text-primary); }
        .btn-danger { background: rgba(244, 63, 94, 0.1); border-color: rgba(244, 63, 94, 0.2); color: var(--danger); }
        .btn-danger:hover { background: var(--danger); color: white; }

        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 0.85rem; font-weight: 500; color: var(--text-secondary); margin-bottom: 8px; }
        .input-control {
            width: 100%; padding: 12px 16px; background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-primary);
            transition: var(--transition); font-size: 0.9rem;
        }
        .input-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); }
        .code-editor { font-family: 'Fira Code', monospace; font-size: 0.88rem; line-height: 1.6; background: #020617; color: #38bdf8; min-height: 220px; tab-size: 2; }

        .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
        .badge-active { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge-py { background: rgba(6, 182, 212, 0.15); color: var(--cyan); border: 1px solid rgba(6, 182, 212, 0.3); }
        .badge-js { background: rgba(245, 158, 11, 0.15); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.3); }

        .top-nav {
            position: fixed; top: 0; left: 0; right: 0; height: 70px; display: flex; align-items: center; justify-content: space-between;
            padding: 0 5%; background: rgba(3, 7, 18, 0.8); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); z-index: 100;
        }
        .logo { font-size: 1.3rem; font-weight: 800; display: flex; align-items: center; gap: 10px; background: linear-gradient(to right, #fff, var(--text-secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo i { color: var(--primary); font-size: 1.6rem; -webkit-text-fill-color: initial; }

        .app-layout { display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 270px; background: rgba(11, 15, 25, 0.9); border-right: 1px solid var(--border); padding: 30px 18px; display: flex; flex-direction: column; z-index: 10; }
        .sidebar-link { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: var(--text-secondary); border-radius: var(--radius-sm); margin-bottom: 6px; cursor: pointer; transition: var(--transition); font-size: 0.92rem; }
        .sidebar-link:hover, .sidebar-link.active { background: rgba(255, 255, 255, 0.05); color: var(--text-primary); }
        .sidebar-link.active { background: rgba(99, 102, 241, 0.12); color: var(--primary); border-right: 3px solid var(--primary); }
        .main-content { flex: 1; overflow-y: auto; padding: 30px 20px; position: relative; z-index: 1; }

        #toast-container { position: fixed; bottom: 30px; right: 30px; z-index: 9999; display: flex; flex-direction: column; gap: 12px; }
        .toast { background: rgba(17, 24, 39, 0.95); backdrop-filter: blur(16px); border: 1px solid var(--border); padding: 14px 20px; border-radius: var(--radius-md); display: flex; align-items: center; gap: 12px; font-size: 0.9rem; }

        .loader-overlay { position: fixed; inset: 0; background: rgba(3, 7, 18, 0.85); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 9998; }
        .spinner { width: 44px; height: 44px; border: 3px solid rgba(255,255,255,0.08); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ================= BIG ERROR MODAL ================= */
        .error-modal-overlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(12px);
            display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 99999;
        }
        .error-modal-card {
            background: #0f172a; border: 2px solid var(--danger); border-radius: var(--radius-lg);
            padding: 32px; max-width: 550px; width: 100%; box-shadow: 0 0 50px rgba(244, 63, 94, 0.3);
            text-align: center; animation: modalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes modalPop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .error-modal-body {
            background: #020617; border: 1px solid rgba(244, 63, 94, 0.3); padding: 16px;
            border-radius: var(--radius-sm); color: #fca5a5; font-family: 'Fira Code', monospace;
            font-size: 0.85rem; text-align: left; word-break: break-all; max-height: 200px; overflow-y: auto; margin: 20px 0;
        }

        @media (max-width: 768px) {
            .app-layout { flex-direction: column; }
            .sidebar { width: 100%; height: auto; padding: 15px; border-right: none; border-bottom: 1px solid var(--border); }
            .sidebar-link { padding: 8px 12px; font-size: 0.85rem; }
            .main-content { padding: 20px 12px; }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>
    <div id="toast-container"></div>
    <div id="loader" class="loader-overlay" style="display:none;"><div class="spinner"></div></div>

    <!-- Big Error Window Overlay -->
    <div id="error-modal" class="error-modal-overlay" style="display:none;">
        <div class="error-modal-card">
            <i class="ph-fill ph-warning-octagon" style="font-size: 3.8rem; color: var(--danger);"></i>
            <h2 id="error-modal-title" style="font-size:1.4rem; font-weight:700; margin-top:12px; color:#fff;">Deployment Failed</h2>
            <div id="error-modal-body" class="error-modal-body">Error details will appear here...</div>
            <button class="btn btn-danger" style="width:100%; padding:12px; font-weight:600;" onclick="closeErrorModal()">Close & Fix Error</button>
        </div>
    </div>

    <div id="app"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, query, where, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCJEMrW8FADRRmKD1WSEOsE9lVoOWoxYtU",
            authDomain: "bothostz.firebaseapp.com",
            projectId: "bothostz",
            storageBucket: "bothostz.firebasestorage.app",
            messagingSenderId: "506392978902",
            appId: "1:506392978902:web:7e962842404f5e91d07077"
        };

        const appFirebase = initializeApp(firebaseConfig);
        const auth = getAuth(appFirebase);
        const db = getFirestore(appFirebase);

        const DOMAIN = "https://webzhost.vercel.app";
        const MAX_FREE_BOTS = 3;

        const state = { user: null, isAdmin: false, currentRoute: '/', bots: [], plan: 'Free' };

        // Global Error Modal Handlers
        window.showBigError = (title, message) => {
            window.toggleLoader(false); // Force Stop Spinner
            document.getElementById('error-modal-title').innerText = title;
            document.getElementById('error-modal-body').innerText = message;
            document.getElementById('error-modal').style.display = 'flex';
        };

        window.closeErrorModal = () => {
            document.getElementById('error-modal').style.display = 'none';
            window.toggleLoader(false);
        };

        // Catch Unhandled Promise Rejections & Global JS Errors
        window.addEventListener('unhandledrejection', (event) => {
            const reason = event.reason ? (event.reason.message || JSON.stringify(event.reason)) : "Unknown Error";
            window.showBigError("Database / Async Error", reason);
        });

        window.onerror = function(msg, url, lineNo) {
            window.showBigError("JavaScript Runtime Error", `${msg}\nLine Number: ${lineNo}`);
            return false;
        };

        const codeTemplates = {
            JS: `// JavaScript Telegram Bot Logic
const text = update.message.text;

if (text === '/start') {
    reply("Hello! Welcome to WebzHost JS Engine 🚀");
} else if (text === 'ping') {
    reply("Pong! 🏓");
} else {
    reply("You typed: " + text);
}`,
            PY: `# Python Telegram Bot Logic
text = update['message']['text']

if text == '/start':
    reply("Hello! Welcome to WebzHost Python Engine 🐍")
elif text == 'ping':
    reply("Pong from Python! 🏓")
else:
    reply(f"You typed: {text}")`
        };

        window.showToast = (msg, type = 'success') => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<i class="ph-fill ${type==='success'?'ph-check-circle':'ph-warning-circle'}" style="color:${type==='success'?'var(--success)':'var(--danger)'}; font-size:1.3rem;"></i> <span>${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3200);
        }

        window.toggleLoader = (show) => document.getElementById('loader').style.display = show ? 'flex' : 'none';
        window.copyText = (text) => { navigator.clipboard.writeText(text); showToast('Copied to clipboard!'); }
        window.navigateTo = (route) => { state.currentRoute = route; render(); window.scrollTo(0, 0); }

        document.body.addEventListener('click', e => {
            const link = e.target.closest('[data-route]');
            if (link) { e.preventDefault(); navigateTo(link.dataset.route); }
        });

        window.handleLangChange = (lang) => {
            const codeEditor = document.getElementById('botCode');
            if (codeEditor) codeEditor.value = codeTemplates[lang];
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                state.user = user;
                await fetchBots();
                if(['/', '/login', '/register'].includes(state.currentRoute)) navigateTo('/dashboard');
            } else {
                state.user = null; state.bots = [];
                if(state.currentRoute !== '/admin-login') navigateTo('/');
            }
            toggleLoader(false);
            render();
        });

        async function fetchBots() {
            if(!state.user) return;
            try {
                const q = query(collection(db, "bots"), where("userId", "==", state.user.uid));
                const snap = await getDocs(q);
                state.bots = [];
                snap.forEach((doc) => state.bots.push({ id: doc.id, ...doc.data() }));
            } catch (err) {
                window.showBigError("Database Fetch Error", err.message);
            }
        }

        window.handleAuth = async (e, isLogin) => {
            e.preventDefault(); toggleLoader(true);
            try {
                if (isLogin) await signInWithEmailAndPassword(auth, e.target.email.value, e.target.password.value);
                else await createUserWithEmailAndPassword(auth, e.target.email.value, e.target.password.value);
                showToast('Welcome to WebzHost!');
            } catch (err) { 
                window.showBigError("Authentication Failed", err.message);
            } finally {
                toggleLoader(false);
            }
        }

        window.adminLogin = (e) => {
            e.preventDefault();
            if(e.target.code.value === '#Zihad077') {
                state.isAdmin = true;
                showToast('Admin Panel Activated');
                navigateTo('/admin');
            } else showToast('Invalid Admin Code', 'error');
        }

        // Bulletproof Fail-safe Deploy Action
        window.createBot = async (e) => {
            e.preventDefault();
            
            if (!state.user) {
                return window.showBigError("Authentication Missing", "You are not logged in. Please log in first.");
            }

            const name = document.getElementById('botName').value.trim();
            const token = document.getElementById('botToken').value.trim();
            const lang = document.getElementById('botLang').value;
            const code = document.getElementById('botCode').value;

            if (!name) return window.showBigError("Input Missing", "Please enter a Bot Name.");
            if (!token) return window.showBigError("Input Missing", "Please enter a Telegram Bot Token.");
            if (!token.includes(':')) return window.showBigError("Invalid Token Format", "Telegram token must contain a colon ':' (e.g., 123456789:ABCdef...).");

            if (state.plan === 'Free' && state.bots.length >= MAX_FREE_BOTS) {
                return window.showBigError("Limit Reached", "Free Plan is limited to 3 bots. Please upgrade to Pro.");
            }

            toggleLoader(true);

            try {
                // 1. Save to Firestore
                const docRef = await addDoc(collection(db, "bots"), {
                    userId: state.user.uid,
                    name: name,
                    token: token,
                    lang: lang,
                    code: code,
                    status: 'active',
                    createdAt: serverTimestamp()
                });

                // 2. Set Webhook
                const endpoint = lang === 'PY' ? '/api/webhook_python' : '/api/webhook';
                const webhookUrl = `${DOMAIN}${endpoint}?botId=${docRef.id}`;
                
                try {
                    await fetch(`https://api.telegram.org/bot${token}/setWebhook?url=${webhookUrl}`);
                } catch (tgErr) {
                    console.warn("Direct Telegram API call warning:", tgErr);
                }

                showToast('Bot Deployed Successfully!');
                await fetchBots();
                navigateTo('/bots');

            } catch (err) {
                window.showBigError("Deployment Failed", `Code: ${err.code || 'UNKNOWN'}\nDetails: ${err.message}`);
            } finally {
                toggleLoader(false); // GUARANTEED TO STOP SPINNER
            }
        }

        window.deleteBot = async (id) => {
            if(confirm('Are you sure you want to delete this bot?')) {
                toggleLoader(true);
                try {
                    await deleteDoc(doc(db, "bots", id));
                    showToast('Bot Removed');
                    await fetchBots();
                    render();
                } catch(err) {
                    window.showBigError("Delete Failed", err.message);
                } finally {
                    toggleLoader(false);
                }
            }
        }

        window.logout = async () => { await signOut(auth); showToast('Logged out successfully'); }

        // Views
        const renderPublicNav = () => `
            <nav class="top-nav">
                <div class="logo" data-route="/"><i class="ph-fill ph-paper-plane-tilt"></i> WebzHost</div>
                <div style="display:flex; gap:10px;">
                    <button class="btn btn-secondary" data-route="/login">Sign In</button>
                    <button class="btn btn-primary" data-route="/register">Get Started</button>
                </div>
            </nav>
        `;

        const renderAuth = (isLogin) => `
            ${renderPublicNav()}
            <div style="display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px;">
                <form class="glass-card" style="width:100%; max-width:400px; margin-top:40px;" onsubmit="handleAuth(event, ${isLogin})">
                    <h2 style="font-weight:700; font-size:1.5rem; margin-bottom:8px;">${isLogin ? 'Welcome Back' : 'Create Account'}</h2>
                    <p style="color:var(--text-secondary); font-size:0.85rem; margin-bottom:20px;">Enter your credentials to manage your bots.</p>
                    <div class="input-group"><label>Email Address</label><input type="email" name="email" class="input-control" placeholder="user@example.com" required></div>
                    <div class="input-group"><label>Password</label><input type="password" name="password" class="input-control" placeholder="••••••••" required></div>
                    <button class="btn btn-primary" style="width:100%; margin-top:8px;">${isLogin ? 'Sign In' : 'Create Account'} <i class="ph ph-arrow-right"></i></button>
                    <p style="margin-top:20px; text-align:center; font-size:0.85rem; color:var(--text-muted);">
                        ${isLogin ? "Don't have an account?" : "Already registered?"} 
                        <a data-route="${isLogin?'/register':'/login'}" style="color:var(--primary); font-weight:500;">${isLogin?'Register':'Sign In'}</a>
                    </p>
                </form>
            </div>
        `;

        const wrapApp = (content) => `
            <div class="app-layout">
                <aside class="sidebar">
                    <div class="logo" data-route="/dashboard" style="margin-bottom:24px;"><i class="ph-fill ph-paper-plane-tilt"></i> WebzHost</div>
                    <div style="display:flex; gap:8px; flex-wrap:wrap;">
                        <div class="sidebar-link ${state.currentRoute==='/dashboard'?'active':''}" data-route="/dashboard"><i class="ph ph-squares-four"></i> Overview</div>
                        <div class="sidebar-link ${state.currentRoute==='/bots'?'active':''}" data-route="/bots"><i class="ph ph-robot"></i> My Bots</div>
                        <div class="sidebar-link ${state.currentRoute==='/create'?'active':''}" data-route="/create"><i class="ph ph-plus-circle"></i> Deploy Bot</div>
                        <div class="sidebar-link ${state.currentRoute==='/pricing'?'active':''}" data-route="/pricing"><i class="ph ph-credit-card"></i> Billing</div>
                    </div>
                    <div style="flex:1;"></div>
                    <div class="sidebar-link" style="color:var(--danger); margin-top:15px;" onclick="logout()"><i class="ph ph-sign-out"></i> Sign Out</div>
                </aside>
                <main class="main-content">${content}</main>
            </div>
        `;

        const renderBots = () => wrapApp(`
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
                <div>
                    <h1 style="font-size:1.5rem; font-weight:700;">My Bots</h1>
                    <p style="color:var(--text-secondary); font-size:0.85rem;">Active serverless instances</p>
                </div>
                <button class="btn btn-primary" data-route="/create"><i class="ph ph-plus-bold"></i> New Bot</button>
            </div>
            <div style="display:grid; gap:16px;">
                ${state.bots.map(b => `
                    <div class="glass-card" style="display:flex; justify-content:space-between; align-items:center; padding:18px;">
                        <div>
                            <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">
                                <i class="ph-fill ph-robot" style="font-size:1.4rem; color:var(--primary);"></i>
                                <h3 style="font-size:1rem; font-weight:600;">${b.name}</h3>
                                <span class="badge ${b.lang==='PY'?'badge-py':'badge-js'}">${b.lang==='PY'?'PYTHON':'NODE.JS'}</span>
                            </div>
                            <p style="color:var(--text-muted); font-size:0.75rem; font-family:'Fira Code', monospace; word-break:break-all;">${DOMAIN}/api/${b.lang==='PY'?'webhook_python':'webhook'}?botId=${b.id}</p>
                        </div>
                        <div style="display:flex; gap:6px;">
                            <button class="btn btn-secondary" style="padding:8px 12px;" onclick="copyText('${DOMAIN}/api/${b.lang==='PY'?'webhook_python':'webhook'}?botId=${b.id}')"><i class="ph ph-copy"></i> URL</button>
                            <button class="btn btn-danger" style="padding:8px 12px;" onclick="deleteBot('${b.id}')"><i class="ph ph-trash"></i></button>
                        </div>
                    </div>
                `).join('')}
                ${state.bots.length===0?'<div class="glass-card" style="text-align:center; padding:40px;"><p style="color:var(--text-secondary);">No bots deployed yet. Click "New Bot" to launch one.</p></div>':''}
            </div>
        `);

        const renderCreate = () => wrapApp(`
            <h1 style="font-size:1.5rem; font-weight:700; margin-bottom:6px;">Deploy Bot</h1>
            <p style="color:var(--text-secondary); font-size:0.85rem; margin-bottom:24px;">Select language and paste execution code.</p>
            <form class="glass-card" style="max-width:800px;" onsubmit="createBot(event)">
                <div class="input-group"><label>Bot Name</label><input id="botName" class="input-control" placeholder="e.g. MyBot" required></div>
                <div class="input-group">
                    <label>Runtime Environment</label>
                    <select id="botLang" class="input-control" onchange="handleLangChange(this.value)">
                        <option value="JS">JavaScript (Node.js)</option>
                        <option value="PY">Python Engine</option>
                    </select>
                </div>
                <div class="input-group"><label>Telegram Token (from @BotFather)</label><input id="botToken" type="password" class="input-control" placeholder="123456789:ABCdef..." required></div>
                <div class="input-group">
                    <label>Bot Execution Script</label>
                    <textarea id="botCode" class="input-control code-editor" required>${codeTemplates.JS}</textarea>
                </div>
                <button class="btn btn-primary" style="width:100%; padding:14px; margin-top:8px;"><i class="ph ph-rocket-launch-bold"></i> Deploy Instantly</button>
            </form>
        `);

        const renderPricing = () => wrapApp(`
            <h1 style="font-size:1.5rem; font-weight:700; margin-bottom:6px;">Subscriptions</h1>
            <p style="color:var(--text-secondary); font-size:0.85rem; margin-bottom:24px;">Plans & Payment Methods</p>
            <div style="display:grid; grid-template-columns: 1fr; gap:20px; max-width:600px;">
                <div class="glass-card">
                    <h3>Free Plan (Active)</h3>
                    <p style="color:var(--text-muted); font-size:0.85rem; margin-top:4px;">Up to 3 Dynamic Bots</p>
                </div>
                <div class="glass-card" style="border-color:var(--primary);">
                    <h3 style="color:var(--primary);">Pro Plan — 550 BDT / $5</h3>
