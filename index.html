<!DOCTYPE html>
<html lang="bn" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5" />
    <title>BotHost — Nova</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..900&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        /* ---------- CSS Variables (Dark/Light) ---------- */
        :root {
            /* Core */
            --bg-base: #0a0e1a;
            --bg-surface: #111827;
            --bg-card: #1a2332;
            --bg-input: #0f1729;
            --bg-hover: #25324a;
            --border-color: #2a3a5a;
            --text-primary: #f0f4ff;
            --text-secondary: #b0c4e8;
            --text-muted: #6b80a8;
            --shadow: 0 12px 40px -8px rgba(0, 0, 0, 0.7);
            --radius: 18px;
            --radius-sm: 10px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);

            /* Gradients */
            --grad-primary: linear-gradient(145deg, #a78bfa, #7c3aed);
            --grad-secondary: linear-gradient(145deg, #22d3ee, #06b6d4);
            --grad-danger: linear-gradient(145deg, #f87171, #dc2626);
            --grad-success: linear-gradient(145deg, #34d399, #10b981);
            --grad-warning: linear-gradient(145deg, #fbbf24, #f59e0b);

            /* Colors */
            --primary: #8b5cf6;
            --primary-dark: #6d28d9;
            --cyan: #22d3ee;
            --success: #34d399;
            --danger: #f87171;
            --warning: #fbbf24;
            --pink: #e879f9;
        }

        [data-theme="light"] {
            --bg-base: #f0f4ff;
            --bg-surface: #ffffff;
            --bg-card: #f8faff;
            --bg-input: #eef2f8;
            --bg-hover: #e2e8f0;
            --border-color: #d0dae8;
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --text-muted: #64748b;
            --shadow: 0 8px 24px -6px rgba(0, 0, 0, 0.08);
            --grad-primary: linear-gradient(145deg, #8b5cf6, #6d28d9);
            --grad-secondary: linear-gradient(145deg, #06b6d4, #0891b2);
        }

        /* ---------- Reset & Base ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background var(--transition), color var(--transition);
            overflow-x: hidden;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        button {
            cursor: pointer;
            border: none;
            background: none;
            font-family: inherit;
        }
        input,
        select,
        textarea {
            font-family: inherit;
            outline: none;
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-base);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 20px;
        }

        /* ---------- Components ---------- */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 22px 26px;
            box-shadow: var(--shadow);
            transition: transform var(--transition), border-color var(--transition);
        }
        .card:hover {
            border-color: var(--primary);
            transform: translateY(-3px);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.9rem;
            transition: var(--transition);
            border: 1px solid transparent;
            letter-spacing: 0.3px;
        }
        .btn-primary {
            background: var(--grad-primary);
            color: #fff;
            box-shadow: 0 4px 16px rgba(139, 92, 246, 0.35);
        }
        .btn-primary:hover {
            transform: scale(1.04);
            box-shadow: 0 8px 28px rgba(139, 92, 246, 0.5);
        }
        .btn-secondary {
            background: var(--bg-input);
            color: var(--text-secondary);
            border-color: var(--border-color);
        }
        .btn-secondary:hover {
            background: var(--bg-hover);
        }
        .btn-danger {
            background: var(--grad-danger);
            color: #fff;
        }
        .btn-danger:hover {
            transform: scale(1.04);
        }
        .btn-success {
            background: var(--grad-success);
            color: #fff;
        }
        .btn-success:hover {
            transform: scale(1.04);
        }
        .btn-ghost {
            color: var(--text-secondary);
        }
        .btn-ghost:hover {
            background: var(--bg-hover);
        }
        .btn-sm {
            padding: 6px 16px;
            font-size: 0.75rem;
        }
        .btn-xs {
            padding: 4px 12px;
            font-size: 0.65rem;
        }

        .input-group {
            margin-bottom: 18px;
        }
        .input-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        .input-control {
            width: 100%;
            padding: 12px 18px;
            background: var(--bg-input);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: var(--transition);
        }
        .input-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.15);
        }
        .input-control::placeholder {
            color: var(--text-muted);
        }
        .code-editor {
            font-family: 'Fira Code', monospace;
            font-size: 0.8rem;
            line-height: 1.6;
            min-height: 150px;
            resize: vertical;
            background: #0a0e1a;
            color: #7dd3fc;
            border-color: rgba(56, 189, 248, 0.2);
        }
        [data-theme="light"] .code-editor {
            background: #eef2f8;
            color: #0f172a;
        }

        .badge {
            padding: 3px 14px;
            border-radius: 30px;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .badge-success {
            background: rgba(52, 211, 153, 0.2);
            color: var(--success);
            border: 1px solid rgba(52, 211, 153, 0.3);
        }
        .badge-danger {
            background: rgba(248, 113, 113, 0.2);
            color: var(--danger);
            border: 1px solid rgba(248, 113, 113, 0.3);
        }
        .badge-warning {
            background: rgba(251, 191, 36, 0.2);
            color: var(--warning);
            border: 1px solid rgba(251, 191, 36, 0.3);
        }
        .badge-info {
            background: rgba(34, 211, 238, 0.2);
            color: var(--cyan);
            border: 1px solid rgba(34, 211, 238, 0.3);
        }
        .badge-primary {
            background: rgba(139, 92, 246, 0.2);
            color: var(--primary);
            border: 1px solid rgba(139, 92, 246, 0.3);
        }

        /* ---------- Toast ---------- */
        #toast-container {
            position: fixed;
            bottom: 90px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 380px;
            width: 100%;
        }
        .toast {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            padding: 14px 20px;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ---------- Loader ---------- */
        .loader-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 14, 26, 0.85);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 18px;
            z-index: 9998;
        }
        .loader-overlay.visible {
            display: flex;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 255, 255, 0.08);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ---------- Modal ---------- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 99999;
        }
        .modal-overlay.visible {
            display: flex;
        }
        .modal-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 36px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            animation: modalPop 0.25s ease;
        }
        @keyframes modalPop {
            from {
                opacity: 0;
                transform: scale(0.92);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* ---------- Top Navigation ---------- */
        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5%;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(14px);
            z-index: 100;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }
        .logo i {
            font-size: 2rem;
            background: var(--grad-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .theme-toggle {
            font-size: 1.5rem;
            color: var(--text-secondary);
            padding: 6px;
            border-radius: 50%;
            transition: var(--transition);
        }
        .theme-toggle:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        /* ---------- App Layout ---------- */
        .app-layout {
            display: flex;
            height: 100vh;
            padding-top: 68px;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: var(--bg-surface);
            border-right: 1px solid var(--border-color);
            padding: 24px 14px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow-y: auto;
            transition: transform 0.3s ease;
            z-index: 50;
        }
        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.9rem;
            transition: var(--transition);
            margin-bottom: 2px;
        }
        .sidebar-link:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        .sidebar-link.active {
            background: rgba(139, 92, 246, 0.12);
            color: var(--primary);
            border-right: 4px solid var(--primary);
        }
        .sidebar-link.admin-link {
            color: var(--pink);
        }
        .sidebar-link.logout-link {
            color: var(--danger);
            margin-top: auto;
        }
        .sidebar-link i {
            font-size: 1.3rem;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 30px 36px 100px;
        }

        /* ---------- Mobile Bottom Nav ---------- */
        .bottom-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 68px;
            background: var(--bg-surface);
            border-top: 1px solid var(--border-color);
            backdrop-filter: blur(14px);
            z-index: 90;
            justify-content: space-around;
            align-items: center;
            padding: 0 8px;
        }
        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            color: var(--text-muted);
            font-size: 0.6rem;
            font-weight: 600;
            transition: var(--transition);
            padding: 6px 12px;
            border-radius: var(--radius-sm);
        }
        .bottom-nav .nav-item i {
            font-size: 1.5rem;
        }
        .bottom-nav .nav-item.active {
            color: var(--primary);
            background: rgba(139, 92, 246, 0.1);
        }
        .bottom-nav .nav-item:hover {
            color: var(--text-primary);
        }

        /* ---------- Responsive ---------- */
        .hamburger {
            display: none;
            font-size: 1.8rem;
            color: var(--text-secondary);
            padding: 6px;
        }
        .hamburger:hover {
            color: var(--text-primary);
        }

        @media (max-width: 900px) {
            .sidebar {
                position: fixed;
                top: 68px;
                left: 0;
                bottom: 0;
                width: 280px;
                transform: translateX(-100%);
                background: var(--bg-surface);
                border-right: 1px solid var(--border-color);
                z-index: 60;
                padding: 20px 14px;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .hamburger {
                display: block;
            }
            .main-content {
                padding: 20px 16px 90px;
            }
            .bottom-nav {
                display: flex;
            }
        }
        @media (max-width: 600px) {
            .top-nav {
                padding: 0 4%;
                height: 60px;
            }
            .app-layout {
                padding-top: 60px;
            }
            .main-content {
                padding: 16px 12px 80px;
            }
            .card {
                padding: 16px 18px;
            }
            .stats-grid {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
            .grid-2 {
                grid-template-columns: 1fr;
            }
            .logo {
                font-size: 1.2rem;
            }
            .nav-actions .btn {
                padding: 8px 14px;
                font-size: 0.75rem;
            }
            .modal-card {
                padding: 24px;
            }
        }

        /* ---------- Utility Classes ---------- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 18px;
            margin-bottom: 28px;
        }
        .stat-card {
            text-align: center;
            padding: 16px 10px;
        }
        .stat-card h3 {
            font-size: 2rem;
            font-weight: 900;
            background: var(--grad-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .stat-card p {
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-top: 2px;
            font-weight: 600;
        }
        .stat-card .trend {
            font-size: 0.7rem;
            color: var(--success);
            -webkit-text-fill-color: var(--success);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        @media (max-width: 700px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }

        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .flex-center {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .mb-2 {
            margin-bottom: 14px;
        }
        .mb-4 {
            margin-bottom: 28px;
        }
        .mt-4 {
            margin-top: 28px;
        }
        .text-muted {
            color: var(--text-muted);
        }
        .text-center {
            text-align: center;
        }
        .w-full {
            width: 100%;
        }
        .gap-2 {
            gap: 10px;
        }
        .flex-wrap {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
        }

        /* ---------- Bot List Item ---------- */
        .bot-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 12px;
        }
        .bot-item:last-child {
            border-bottom: none;
        }
        .bot-meta {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .bot-meta .name {
            font-weight: 700;
            font-size: 1.05rem;
        }
        .bot-meta .username {
            color: var(--text-muted);
            font-size: 0.8rem;
        }
        .bot-meta .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 4px;
        }
        .bot-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* ---------- Announcement ---------- */
        .announce-item {
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }
        .announce-item:last-child {
            border-bottom: none;
        }
        .announce-item .title {
            font-weight: 700;
        }
        .announce-item .date {
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        /* ---------- Activity & Chart ---------- */
        .activity-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }
        .activity-item .time {
            color: var(--text-muted);
            font-size: 0.75rem;
        }
        .chart-bars {
            display: flex;
            align-items: flex-end;
            gap: 6px;
            height: 100px;
            padding-top: 10px;
        }
        .chart-bar {
            flex: 1;
            background: var(--grad-primary);
            border-radius: 6px 6px 0 0;
            min-height: 6px;
            transition: height 0.4s;
            opacity: 0.8;
        }
        .chart-bar:hover {
            opacity: 1;
        }

        /* ---------- Footer ---------- */
        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .footer-links {
            display: flex;
            gap: 18px;
        }
        .footer-links a:hover {
            color: var(--text-primary);
        }

        /* ---------- Landing page ---------- */
        .hero-gradient-text {
            background: var(--grad-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .mock-terminal {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            overflow: hidden;
            text-align: left;
        }
        .mock-terminal .header {
            padding: 10px 16px;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 8px;
        }
        .mock-terminal .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .mock-terminal .code {
            font-family: 'Fira Code', monospace;
            padding: 20px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <!-- Toast -->
    <div id="toast-container"></div>

    <!-- Loader -->
    <div id="loader" class="loader-overlay">
        <div class="spinner"></div>
        <p style="color:var(--text-secondary);">Loading…</p>
    </div>

    <!-- Error Modal -->
    <div id="error-modal" class="modal-overlay">
        <div class="modal-card" style="border-color:var(--danger);">
            <i class="ph-fill ph-warning-octagon" style="font-size:3.5rem; color:var(--danger);"></i>
            <h2 id="error-title" style="font-size:1.5rem; margin:16px 0 8px;">Error</h2>
            <div id="error-body" style="background:var(--bg-input); padding:16px; border-radius:var(--radius-sm); font-family:'Fira Code',monospace; font-size:0.8rem; text-align:left; margin:16px 0; color:var(--text-secondary);"></div>
            <button class="btn btn-primary w-full" onclick="closeErrorModal()">Dismiss</button>
        </div>
    </div>

    <!-- App -->
    <div id="app"></div>

    <script type="module">
        // ============================================================
        //  IMPORTS
        // ============================================================
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import {
            getAuth,
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword,
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import {
            getFirestore,
            collection,
            addDoc,
            getDocs,
            query,
            where,
            deleteDoc,
            doc,
            setDoc,
            updateDoc,
            serverTimestamp,
            getDoc
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ============================================================
        //  FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyCJEMrW8FADRRmKD1WSEOsE9lVoOWoxYtU",
            authDomain: "bothostz.firebaseapp.com",
            projectId: "bothostz",
            storageBucket: "bothostz.firebasestorage.app",
            messagingSenderId: "506392978902",
            appId: "1:506392978902:web:7e962842404f5e91d07077"
        };

        const appFirebase = initializeApp(firebaseConfig);
        const auth = getAuth(appFirebase);
        const db = getFirestore(appFirebase, "webzhost");
        const DOMAIN = "https://webzhost.vercel.app";

        // ============================================================
        //  CODE TEMPLATES
        // ============================================================
        const codeTemplates = {
            JS: `const express = require('express');
        const app = express();

                                                <div class="text-muted" style="font-size:0.9rem;">${a.body}</div>
                                                <div class="date">${a.createdAt ? new Date(a.createdAt.seconds*1000).toLocaleDateString() : 'Recent'}</div>
                                            </div>
                                        `).join('')
                                    }
                                </div>
                                <div class="card">
                                    <h3 style="font-size:1.2rem; margin-bottom:10px;">🟢 System Status</h3>
                                    <div><span class="badge badge-success">●</span> API Server — Operational</div>
                                    <div><span class="badge badge-success">●</span> Webhook — Operational</div>
                                    <div><span class="badge badge-success">●</span> Database — Operational</div>
                                </div>
                            </div>
                        </div>

                        <div class="grid-2 mt-4">
                            <div class="card">
                                <h3 style="font-size:1.2rem; margin-bottom:10px;">Recent Activity</h3>
                                ${state.activityLog.slice(0, 5).map(a => `
                                    <div class="activity-item"><span>${a.action}</span><span class="time">${a.time}</span></div>
                                `).join('') || '<p class="text-muted">No activity yet.</p>'}
                            </div>
                            <div class="card">
                                <h3 style="font-size:1.2rem; margin-bottom:10px;">This Week Deployments</h3>
                                <div class="chart-bars">
                                    ${[10, 16, 12, 20, 14, 18, 8].map(h => `
                                        <div class="chart-bar" style="height:${(h/22)*100}%;"></div>
                                    `).join('')}
                                </div>
                                <div style="display:flex; justify-content:space-between; font-size:0.6rem; color:var(--text-muted); margin-top:6px;">
                                    <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
                                </div>
                            </div>
                        </div>

                        <div class="footer">
                            <span>© 2025 BotHost. All rights reserved.</span>
                            <div class="footer-links"><a href="#">Terms</a><a href="#">Privacy</a><a href="#">Support</a><a href="#">English</a></div>
                        </div>
                    `);
                    break;
                }
                case '/bots':
                    app.innerHTML = wrapApp(`
                        <div class="flex-between mb-4">
                            <h1 style="font-size:1.8rem; font-weight:900;">My Bots</h1>
                            <button class="btn btn-primary" data-route="/create"><i class="ph ph-plus-bold"></i> New Bot</button>
                        </div>
                        <div class="card" style="padding:0; overflow:hidden;">
                            ${state.bots.length === 0 ? `
                                <div style="text-align:center; padding:60px 20px;">
                                    <i class="ph-fill ph-robot" style="font-size:3rem; color:var(--text-muted);"></i>
                                    <p class="text-muted" style="margin-top:12px;">No bots deployed yet.</p>
                                </div>
                            ` : state.bots.map(b => `
                                <div class="bot-item">
                                    <div class="bot-meta">
                                        <div class="name">${b.name} <span class="badge ${b.lang === 'PY' ? 'badge-info' : 'badge-warning'}">${b.lang}</span></div>
                                        <div class="username">@${b.name.replace(/\s/g,'')}Bot</div>
                                        <div class="tags">
                                            <span class="badge ${b.status === 'active' ? 'badge-success' : 'badge-danger'}">${b.status}</span>
                                            <span class="badge ${b.webhookStatus === 'connected' ? 'badge-success' : 'badge-danger'}">webhook ${b.webhookStatus}</span>
                                        </div>
                                        <div style="font-size:0.7rem; color:var(--text-muted); font-family:monospace;">${DOMAIN}/api/webhook?botId=${b.id}</div>
                                    </div>
                                    <div class="bot-actions">
                                        <button class="btn btn-secondary btn-xs" onclick="copyText('${DOMAIN}/api/webhook?botId=${b.id}')"><i class="ph ph-copy"></i></button>
                                        ${b.webhookStatus !== 'connected' ? `<button class="btn btn-warning btn-xs" onclick="reconnectWebhook('${b.id}','${b.token||''}')"><i class="ph ph-arrows-clockwise"></i></button>` : ''}
                                        <button class="btn btn-secondary btn-xs" onclick="redeployBot('${b.id}')"><i class="ph ph-rotate"></i></button>
                                        <button class="btn btn-danger btn-xs" onclick="deleteBot('${b.id}','${b.token||''}')"><i class="ph ph-trash"></i></button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `);
                    break;
                case '/create':
                    app.innerHTML = wrapApp(`
                        <h1 style="font-size:1.8rem; font-weight:900; margin-bottom:24px;">Deploy New Bot</h1>
                        <form class="card" style="max-width:760px; padding:28px;" onsubmit="createBot(event)">
                            <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">
                                <div class="input-group"><label>Bot Name</label><input id="botName" class="input-control" placeholder="My Bot" required /></div>
                                <div class="input-group"><label>Language</label>
                                    <select id="botLang" class="input-control" onchange="document.getElementById('botCode').value = this.value==='PY' ? \`${codeTemplates.PY}\` : \`${codeTemplates.JS}\`">
                                        <option value="JS">JavaScript</option>
                                        <option value="PY">Python</option>
                                    </select>
                                </div>
                            </div>
                            <div class="input-group"><label>Telegram Bot Token</label><input id="botToken" type="password" class="input-control" placeholder="123456:ABC-DEF1234ghIkl-zyx" required /></div>
                            <div class="input-group"><label>Bot Code</label><textarea id="botCode" class="input-control code-editor" required>${codeTemplates.JS}</textarea></div>
                            <button class="btn btn-primary w-full" style="padding:16px;"><i class="ph ph-rocket-launch-bold"></i> Deploy</button>
                        </form>
                    `);
                    break;
                case '/webhook-logs':
                    app.innerHTML = wrapApp(`
                        <h1 style="font-size:1.8rem; font-weight:900; margin-bottom:24px;">Webhook Logs</h1>
                        <div class="card">
                            ${state.bots.length === 0 ? '<p class="text-muted">No bots to show logs.</p>' :
                                state.bots.map(b => `
                                    <div class="bot-item" style="border-bottom:1px solid var(--border-color);">
                                        <div><strong>${b.name}</strong> <span class="badge ${b.webhookStatus === 'connected' ? 'badge-success' : 'badge-danger'}">${b.webhookStatus}</span></div>
                                        <div style="font-size:0.8rem; color:var(--text-secondary);">
                                            Requests: ${Math.floor(Math.random()*120)} &nbsp;|&nbsp; Failed: ${Math.floor(Math.random()*6)}
                                        </div>
                                    </div>
                                `).join('')
                            }
                        </div>
                    `);
                    break;
                case '/pricing':
                    app.innerHTML = wrapApp(`
                        <h1 style="font-size:1.8rem; font-weight:900; margin-bottom:24px;">Pricing Plans</h1>
                        <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:24px; margin-bottom:40px;">
                            ${state.plans.map(p => `
                                <div class="card" style="text-align:center; ${state.userProfile?.plan === p.name ? 'border-color:var(--primary);' : ''}">
                                    <h3>${p.name}</h3>
                                    <p class="text-muted">${p.description}</p>
                                    <div style="font-size:2.2rem; font-weight:900; background:var(--grad-primary); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin:12px 0;">${p.price} ৳</div>
                                    <p>Max Bots: ${p.maxBots >= 9999 ? '∞' : p.maxBots}</p>
                                    ${state.userProfile?.plan === p.name ? '<span class="badge badge-success">Current Plan</span>' : ''}
                                </div>
                            `).join('')}
                        </div>
                        <div class="card" style="max-width:520px;">
                            <h3 style="margin-bottom:12px;">Upgrade Request</h3>
                            <div style="background:var(--bg-input); padding:16px; border-radius:var(--radius-sm); font-size:0.9rem; margin-bottom:20px;">
                                <p><b>bKash:</b> <span style="color:var(--warning);">${state.paymentSettings.bkash}</span></p>
                                <p><b>Nagad:</b> <span style="color:var(--warning);">${state.paymentSettings.nagad}</span></p>
                                <p><b>Binance:</b> <span style="color:var(--cyan);">${state.paymentSettings.binance}</span></p>
                            </div>
                            <form onsubmit="submitPayment(event)">
                                <div class="input-group"><label>Plan</label><select name="planName" class="input-control">${state.plans.filter(p=>p.price>0).map(p=>`<option value="${p.name}">${p.name} (${p.price} ৳)</option>`).join('')}</select></div>
                                <div class="input-group"><label>Method</label><select name="method" class="input-control"><option>bKash</option><option>Nagad</option><option>Binance</option></select></div>
                                <div class="input-group"><label>TrxID</label><input name="trxId" class="input-control" required /></div>
                                <button class="btn btn-primary w-full" style="padding:14px;">Submit</button>
                            </form>
                        </div>
                    `);
                    break;
                case '/settings':
                    app.innerHTML = wrapApp(`
                        <h1 style="font-size:1.8rem; font-weight:900; margin-bottom:24px;">Account Settings</h1>
                        <div class="card" style="max-width:520px;">
                            <p><strong>Email:</strong> ${state.user?.email}</p>
                            <p><strong>Plan:</strong> ${state.userProfile?.plan || 'Free'}</p>
                            <p><strong>Display Name:</strong> ${state.userProfile?.displayName || 'Not set'}</p>
                            <hr style="border-color:var(--border-color); margin:20px 0;" />
                            <button class="btn btn-secondary" onclick="showToast('Password reset link sent to your email.')">Change Password</button>
                            <button class="btn btn-danger" style="margin-left:12px;" onclick="if(confirm('Delete account?')){showToast('Account deletion not implemented in demo.')}">Delete Account</button>
                        </div>
                    `);
                    break;
                case '/admin-login':
                    app.innerHTML = `
                        <div style="display:flex; justify-content:center; align-items:center; min-height:100vh; padding:24px;">
                            <form class="card" style="width:100%; max-width:380px; padding:32px;" onsubmit="adminLogin(event)">
                                <h2 style="color:var(--pink); margin-bottom:8px;">🔐 Admin Access</h2>
                                <p class="text-muted" style="margin-bottom:24px;">Enter security passcode</p>
                                <div class="input-group"><label>Passcode</label><input type="password" name="code" class="input-control" placeholder="••••••••" required /></div>
                                <button class="btn btn-primary w-full" style="padding:14px;">Unlock</button>
                            </form>
                        </div>
                    `;
                    break;
                case '/admin':
                    if (!state.isAdmin) { navigateTo('/admin-login'); return; }
                    app.innerHTML = wrapApp(`
                        <h1 style="font-size:1.8rem; font-weight:900; color:var(--pink); margin-bottom:8px;">Admin Console</h1>
                        <p class="text-muted mb-4">Manage users, bots, payments, announcements & settings.</p>

                        <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:16px; margin-bottom:28px;">
                            <div class="card text-center"><h3>${state.allUsers.length}</h3><p class="text-muted">Users</p></div>
                            <div class="card text-center"><h3>${state.allBots.length}</h3><p class="text-muted">Bots</p></div>
                            <div class="card text-center"><h3>${state.payments.filter(p=>p.status==='pending').length}</h3><p class="text-muted">Pending</p></div>
                        </div>

                        <div class="grid-2">
                            <div class="card">
                                <h3 style="margin-bottom:12px;">Pending Payments</h3>
                                ${state.payments.filter(p=>p.status==='pending').length===0?'<p class="text-muted">None</p>':
                                    state.payments.filter(p=>p.status==='pending').map(p=>`
                                        <div class="bot-item" style="border-bottom:1px solid var(--border-color);">
                                            <div><strong>${p.userEmail}</strong><br/><span class="text-muted">${p.planName} · ${p.trxId}</span></div>
                                            <button class="btn btn-success btn-sm" onclick="approvePayment('${p.id}','${p.userId}','${p.planName}')">Approve</button>
                                        </div>
                                    `).join('')
                                }
                            </div>
                            <div class="card">
                                <h3 style="margin-bottom:12px;">➕ Add Announcement</h3>
                                <form onsubmit="adminAddAnnouncement(event)">
                                    <div class="input-group"><label>Title</label><input name="anTitle" class="input-control" required /></div>
                                    <div class="input-group"><label>Body</label><textarea name="anBody" class="input-control" rows="2" required></textarea></div>
                                    <button class="btn btn-primary w-full">Publish</button>
                                </form>
                            </div>
                        </div>

                        <div class="grid-2 mt-4">
                            <form class="card" onsubmit="adminUpdateSettings(event)">
                                <h3 style="margin-bottom:12px; color:var(--warning);">💳 Payment Numbers</h3>
                                <div class="input-group"><label>bKash</label><input name="bkash" class="input-control" value="${state.paymentSettings.bkash}" /></div>
                                <div class="input-group"><label>Nagad</label><input name="nagad" class="input-control" value="${state.paymentSettings.nagad}" /></div>
                                <div class="input-group"><label>Binance</label><input name="binance" class="input-control" value="${state.paymentSettings.binance}" /></div>
                                <button class="btn btn-secondary w-full">Update</button>
                            </form>
                            <form class="card" onsubmit="adminAddPlan(event)">
                                <h3 style="margin-bottom:12px; color:var(--cyan);">➕ New Plan</h3>
                                <div class="input-group"><label>Name</label><input name="pName" class="input-control" required /></div>
                                <div class="input-group"><label>Description</label><input name="pDesc" class="input-control" required /></div>
                                <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                                    <div class="input-group"><label>Price</label><input type="number" name="pPrice" class="input-control" required /></div>
                                    <div class="input-group"><label>Max Bots</label><input type="number" name="pLimit" class="input-control" required /></div>
                                </div>
                                <button class="btn btn-primary w-full">Create</button>
                            </form>
                        </div>
                    `);
                    break;
                default:
                    app.innerHTML = `<div class="text-center" style="padding:80px;"><h2>404</h2><p class="text-muted">Page not found</p></div>`;
            }
        }

        // ============================================================
        //  INIT
        // ============================================================
        window.addEventListener('load', () => {
            handleHashRoute();
            window.toggleLoader(true);
            document.addEventListener('change', (e) => {
                if (e.target.id === 'botLang') {
                    const code = document.getElementById('botCode');
                    if (code) code.value = e.target.value === 'PY' ? codeTemplates.PY : codeTemplates.JS;
                }
            });
        });

        window.render = render;
    </script>
</body>
</html>
