<!DOCTYPE html>
<html lang="bn" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebzHost — Telegram Bot Hosting</title>

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    /* ============================================================
         ROOT VARIABLES (Dark / Light)
         ============================================================ */
    :root {
      --bg-deep: #030712;
      --bg-surface: #0f172a;
      --bg-card: rgba(15, 23, 42, 0.7);
      --border-subtle: rgba(148, 163, 184, 0.12);
      --border-glow: rgba(99, 102, 241, 0.5);
      --text-primary: #f1f5f9;
      --text-secondary: #cbd5e1;
      --text-muted: #64748b;
      --primary: #818cf8;
      --primary-dark: #6366f1;
      --primary-glow: rgba(99, 102, 241, 0.35);
      --cyan: #22d3ee;
      --success: #34d399;
      --warning: #fbbf24;
      --danger: #f87171;
      --pink: #e879f9;
      --radius: 16px;
      --radius-sm: 10px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      --shadow-card: 0 20px 40px -12px rgba(0, 0, 0, 0.7);
    }

    [data-theme="light"] {
      --bg-deep: #f1f5f9;
      --bg-surface: #e2e8f0;
      --bg-card: rgba(255, 255, 255, 0.75);
      --border-subtle: rgba(15, 23, 42, 0.12);
      --text-primary: #0f172a;
      --text-secondary: #1e293b;
      --text-muted: #475569;
      --shadow-card: 0 20px 40px -12px rgba(0, 0, 0, 0.15);
    }

    /* ============================================================
         RESET & BASE
         ============================================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-deep);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.6;
      transition: background 0.3s, color 0.3s;
    }
    a {
      text-decoration: none;
      color: inherit;
    }
    button {
      cursor: pointer;
      border: none;
      background: none;
      font-family: inherit;
    }
    input,
    select,
    textarea {
      font-family: inherit;
      outline: none;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-deep);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--primary-dark);
      border-radius: 10px;
    }

    /* ============================================================
         GLASS & CARDS
         ============================================================ */
    .glass {
      background: var(--bg-card);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      box-shadow: var(--shadow-card);
      transition: var(--transition);
    }
    .glass:hover {
      border-color: var(--border-glow);
      transform: translateY(-3px);
    }

    /* ============================================================
         BUTTONS
         ============================================================ */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 28px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 0.95rem;
      transition: var(--transition);
      border: 1px solid transparent;
      letter-spacing: 0.3px;
    }
    .btn--primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      box-shadow: 0 6px 24px var(--primary-glow);
    }
    .btn--primary:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 12px 32px var(--primary-glow);
    }
    .btn--secondary {
      background: rgba(255, 255, 255, 0.06);
      border-color: var(--border-subtle);
      color: var(--text-secondary);
    }
    .btn--secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
    }
    .btn--danger {
      background: rgba(248, 113, 113, 0.12);
      color: var(--danger);
      border-color: rgba(248, 113, 113, 0.25);
    }
    .btn--danger:hover {
      background: var(--danger);
      color: #fff;
    }
    .btn--success {
      background: rgba(52, 211, 153, 0.12);
      color: var(--success);
      border-color: rgba(52, 211, 153, 0.25);
    }
    .btn--success:hover {
      background: var(--success);
      color: #fff;
    }
    .btn--admin {
      background: linear-gradient(135deg, var(--pink), #d946ef);
      color: #fff;
    }
    .btn--admin:hover {
      transform: scale(1.04);
    }

    /* ============================================================
         INPUTS
         ============================================================ */
    .input-group {
      margin-bottom: 20px;
    }
    .input-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .input-group .helper {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .input-control {
      width: 100%;
      padding: 14px 16px;
      background: rgba(3, 7, 18, 0.7);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 0.95rem;
      transition: var(--transition);
    }
    .input-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-glow);
    }
    .input-control--with-icon {
      padding-right: 48px;
    }
    .input-wrapper {
      position: relative;
    }
    .input-wrapper .toggle-vis {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
    }
    .input-wrapper .toggle-vis:hover {
      color: var(--text-primary);
    }

    /* ============================================================
         BADGE
         ============================================================ */
    .badge {
      padding: 4px 14px;
      border-radius: 30px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.4px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
    }
    .badge--active {
      background: rgba(52, 211, 153, 0.18);
      color: var(--success);
      border: 1px solid rgba(52, 211, 153, 0.3);
    }
    .badge--inactive {
      background: rgba(248, 113, 113, 0.12);
      color: var(--danger);
      border: 1px solid rgba(248, 113, 113, 0.25);
    }
    .badge--connected {
      background: rgba(34, 211, 238, 0.15);
      color: var(--cyan);
      border: 1px solid rgba(34, 211, 238, 0.25);
    }
    .badge--disconnected {
      background: rgba(251, 191, 36, 0.15);
      color: var(--warning);
      border: 1px solid rgba(251, 191, 36, 0.25);
    }
    .badge--py {
      background: rgba(34, 211, 238, 0.15);
      color: var(--cyan);
      border: 1px solid rgba(34, 211, 238, 0.25);
    }
    .badge--js {
      background: rgba(251, 191, 36, 0.15);
      color: var(--warning);
      border: 1px solid rgba(251, 191, 36, 0.25);
    }

    /* ============================================================
         TOAST
         ============================================================ */
    #toast-container {
      position: fixed;
      bottom: 30px;
      right: 30px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 420px;
      width: 100%;
    }
    .toast {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      padding: 16px 22px;
      border-radius: var(--radius-sm);
      box-shadow: 0 20px 40px -8px rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      gap: 14px;
      font-weight: 500;
      animation: slideInToast 0.3s ease;
    }
    @keyframes slideInToast {
      from {
        opacity: 0;
        transform: translateX(40px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* ============================================================
         LOADER / SKELETON
         ============================================================ */
    .loader-overlay {
      position: fixed;
      inset: 0;
      background: rgba(3, 7, 18, 0.85);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9998;
      flex-direction: column;
      gap: 20px;
    }
    .loader-overlay--visible {
      display: flex;
    }
    .spinner {
      width: 56px;
      height: 56px;
      border: 5px solid rgba(255, 255, 255, 0.06);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .skeleton {
      background: linear-gradient(90deg, var(--bg-surface) 25%, var(--border-subtle) 50%, var(--bg-surface) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: var(--radius-sm);
    }
    @keyframes shimmer {
      0% {
        background-position: -200% 0;
      }
      100% {
        background-position: 200% 0;
      }
    }

    /* ============================================================
         MODAL
         ============================================================ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(14px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 99999;
    }
    .modal-overlay--visible {
      display: flex;
    }
    .modal-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      padding: 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 50px 80px -20px #000;
      animation: modalPop 0.25s ease;
    }
    @keyframes modalPop {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* ============================================================
         LAYOUT
         ============================================================ */
    .top-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5%;
      background: rgba(3, 7, 18, 0.75);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border-subtle);
      z-index: 100;
      transition: background 0.3s;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      cursor: pointer;
    }
    .logo i {
      color: var(--primary);
      font-size: 2rem;
    }

    .app-layout {
      display: flex;
      height: 100vh;
      overflow: hidden;
      padding-top: 72px;
    }
    .sidebar {
      width: 280px;
      background: rgba(9, 13, 31, 0.96);
      border-right: 1px solid var(--border-subtle);
      padding: 28px 18px;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow-y: auto;
      transition: var(--transition);
    }
    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      color: var(--text-secondary);
      border-radius: var(--radius-sm);
      margin-bottom: 4px;
      cursor: pointer;
      transition: var(--transition);
      font-weight: 600;
      font-size: 0.95rem;
    }
    .sidebar-link:hover {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-primary);
    }
    .sidebar-link--active {
      background: rgba(99, 102, 241, 0.15);
      color: var(--primary);
      border-right: 3px solid var(--primary);
    }
    .sidebar-link--admin {
      color: var(--pink);
    }
    .sidebar-link--logout {
      color: var(--danger);
      margin-top: auto;
    }
    .sidebar-link .theme-toggle {
      margin-left: auto;
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 1.3rem;
      cursor: pointer;
    }

    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 40px 44px;
      position: relative;
      z-index: 1;
    }

    /* ============================================================
         RESPONSIVE
         ============================================================ */
    @media (max-width: 900px) {
      .sidebar {
        width: 0;
        padding: 0;
        border: none;
        overflow: hidden;
        flex-shrink: 0;
      }
      .sidebar--open {
        width: 280px;
        padding: 28px 18px;
        border-right: 1px solid var(--border-subtle);
        flex-shrink: 0;
      }
      .main-content {
        padding: 24px 18px;
      }
      .top-nav {
        padding: 0 4%;
      }
      .hamburger {
        display: flex !important;
      }
    }
    .hamburger {
      display: none;
      font-size: 1.8rem;
      color: var(--text-secondary);
      background: none;
      border: none;
      padding: 6px;
      z-index: 101;
    }
    .hamburger:hover {
      color: #fff;
    }

    /* ============================================================
         UTILITY
         ============================================================ */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }
    .flex-between {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    .mt-4 {
      margin-top: 32px;
    }
    .mb-4 {
      margin-bottom: 32px;
    }
    .text-muted {
      color: var(--text-muted);
    }
    .text-center {
      text-align: center;
    }
    .w-full {
      width: 100%;
    }
    .gap-4 {
      gap: 16px;
    }

    /* ============================================================
         LANDING PAGE SPECIFIC
         ============================================================ */
    .hero-title {
      font-size: 4.2rem;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -1.5px;
    }
    .hero-gradient {
      background: linear-gradient(135deg, var(--primary), var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .mock-terminal {
      background: var(--bg-deep);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 30px 60px -20px #000;
    }
    .mock-terminal-header {
      background: var(--bg-surface);
      padding: 12px 18px;
      display: flex;
      gap: 10px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .mock-dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
    }
    .mock-code {
      font-family: 'Fira Code', monospace;
      color: #7dd3fc;
      padding: 28px;
      font-size: 0.95rem;
      line-height: 1.7;
      white-space: pre-wrap;
      border-right: 2px solid var(--primary);
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      50% {
        border-color: transparent;
      }
    }

    /* ============================================================
         BOT / TABLE CARDS
         ============================================================ */
    .bot-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      padding: 18px 24px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .bot-item:last-child {
      border-bottom: none;
    }
    .bot-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .bot-url {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-family: 'Fira Code', monospace;
      word-break: break-all;
    }
    .bot-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* ============================================================
         STEP PROGRESS
         ============================================================ */
    .step-indicator {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 24px 0;
      position: relative;
    }
    .step-indicator::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--border-subtle);
      transform: translateY(-50%);
      z-index: 0;
    }
    .step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 1;
      background: var(--bg-deep);
      padding: 0 12px;
    }
    .step .step-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-muted);
      transition: var(--transition);
    }
    .step.active .step-icon {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 0 0 4px var(--primary-glow);
    }
    .step.done .step-icon {
      background: var(--success);
      color: #fff;
    }
    .step.error .step-icon {
      background: var(--danger);
      color: #fff;
    }
    .step .step-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
    }
    .step.active .step-label {
      color: var(--text-primary);
    }

    /* ============================================================
         RESPONSIVE TWEAKS
         ============================================================ */
    @media (max-width: 600px) {
      .hero-title {
        font-size: 2.6rem;
      }
      .grid-2,
      .grid-3 {
        grid-template-columns: 1fr;
      }
      .bot-item {
        flex-direction: column;
        align-items: stretch;
      }
      .bot-actions {
        justify-content: flex-start;
      }
      .modal-card {
        padding: 24px;
      }
      .step-indicator {
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
      }
      .step-indicator::before {
        display: none;
      }
    }

    /* ============================================================
         ANNOUNCEMENT BANNER
         ============================================================ */
    .announcement-banner {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(34, 211, 238, 0.15));
      border: 1px solid var(--border-glow);
      border-radius: var(--radius-sm);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .announcement-banner i {
      color: var(--primary);
      font-size: 1.5rem;
    }
  </style>
</head>
<body>

  <!-- ============================================================
  GLOW ORBS
  ============================================================ -->
  <div class="glow-orb" style="position:fixed; width:600px; height:600px; top:-200px; left:-100px; background:radial-gradient(circle,rgba(99,102,241,0.2),transparent 70%); filter:blur(100px); pointer-events:none; z-index:0; animation:floatOrb 12s ease-in-out infinite alternate;"></div>
  <div class="glow-orb" style="position:fixed; width:500px; height:500px; bottom:-150px; right:-100px; background:radial-gradient(circle,rgba(34,211,238,0.15),transparent 70%); filter:blur(100px); pointer-events:none; z-index:0; animation:floatOrb 16s ease-in-out infinite alternate-reverse;"></div>
  <style>
    @keyframes floatOrb {
      0% {
        transform: translate(0, 0) scale(1);
      }
      100% {
        transform: translate(40px, 30px) scale(1.15);
      }
    }
  </style>

  <!-- ============================================================
  TOAST CONTAINER
  ============================================================ -->
  <div id="toast-container"></div>

  <!-- ============================================================
  LOADER
  ============================================================ -->
  <div id="loader" class="loader-overlay">
    <div class="spinner"></div>
    <p style="color:var(--text-secondary); font-weight:500;">Loading…</p>
  </div>

  <!-- ============================================================
  ERROR MODAL
  ============================================================ -->
  <div id="error-modal" class="modal-overlay">
    <div class="modal-card" style="border-color:var(--danger);">
      <i class="ph-fill ph-warning-octagon" style="font-size:4rem; color:var(--danger);"></i>
      <h2 id="error-modal-title" style="font-size:1.6rem; font-weight:800; margin:16px 0 8px; color:#fff;">Error</h2>
      <div id="error-modal-body" style="background:rgba(0,0,0,0.5); border:1px solid rgba(248,113,113,0.2); padding:18px; border-radius:var(--radius-sm); color:#fca5a5; font-family:'Fira Code',monospace; font-size:0.85rem; text-align:left; margin:20px 0;">Details…</div>
      <button class="btn btn--danger w-full" onclick="closeErrorModal()" style="padding:14px;">Dismiss</button>
    </div>
  </div>

  <!-- ============================================================
  CONFIRMATION MODAL
  ============================================================ -->
  <div id="confirm-modal" class="modal-overlay">
    <div class="modal-card">
      <i class="ph-fill ph-question" style="font-size:3rem; color:var(--warning);"></i>
      <h2 id="confirm-title" style="font-size:1.3rem; font-weight:700; margin:12px 0 6px;">Are you sure?</h2>
      <p id="confirm-message" style="color:var(--text-muted); margin-bottom:20px;">This action cannot be undone.</p>
      <div style="display:flex; gap:12px; justify-content:center;">
        <button class="btn btn--secondary" onclick="closeConfirm()">Cancel</button>
        <button id="confirm-action" class="btn btn--danger">Confirm</button>
      </div>
    </div>
  </div>

  <!-- ============================================================
  ROOT APP
  ============================================================ -->
  <div id="app"></div>

  <!-- ============================================================
  FIREBASE + MAIN SCRIPT
  ============================================================ -->
  <script type="module">
    // ==========================================================
    // IMPORTS
    // ==========================================================
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      onAuthStateChanged,
      signOut,
      updatePassword
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import {
      getFirestore,
      collection,

    window.createBot = async (e) => {
      e.preventDefault();
      const planName = state.userProfile?.plan || 'Free';
      const userPlan = state.plans.find(p => p.name.toLowerCase() === planName.toLowerCase()) || { maxBots: 3 };

      if (state.bots.length >= userPlan.maxBots) {
        return showBigError('Limit Reached', `Your "${planName}" plan allows max ${userPlan.maxBots} bots. Please upgrade.`);
      }

      const name = document.getElementById('botName').value.trim();
      const token = document.getElementById('botToken').value.trim();
      const lang = document.getElementById('botLang').value;
      const code = document.getElementById('botCode').value;

      if (!name || !token || !code) {
        return showBigError('Missing Fields', 'Please fill all required fields.');
      }

      // Start step-by-step progress
      state.deployCurrentStep = -1;
      state.deploySuccess = false;
      state.deployError = null;
      render(); // show progress UI

      const steps = state.deploySteps;
      for (let i = 0; i < steps.length - 1; i++) {
        state.deployCurrentStep = i;
        render();
        await sleep(600); // simulate step
      }

      // Actually deploy
      window.toggleLoader(true);
      try {
        const docRef = await addDoc(collection(db, "bots"), {
          userId: state.user.uid,
          name,
          token,
          lang,
          code,
          status: 'active',
          webhookStatus: 'connected',
          createdAt: serverTimestamp()
        });

        const webhookUrl = `${DOMAIN}/api/${lang === 'PY' ? 'webhook_python' : 'webhook'}?botId=${docRef.id}`;

          await fetch(`https://api.telegram.org/bot${token}/setWebhook?url=${webhookUrl}`);
        } catch (whErr) {
          console.warn('Webhook set failed:', whErr);
        }

        state.deployCurrentStep = steps.length - 1; // Success step
        state.deploySuccess = true;
        state.deployError = null;

        await fetchBots();
        render();
      } catch (err) {
        state.deployError = err.message;
        state.deploySuccess = false;
        showBigError('Deploy Failed', err.message);
        render();
      } finally {
        window.toggleLoader(false);
      }
    };

    function renderDeploy() {
      const steps = state.deploySteps;
      const current = state.deployCurrentStep;
      const success = state.deploySuccess;
      const error = state.deployError;

      // If deployment is in progress or finished, show progress UI
      if (current >= 0 || success || error) {
        return `
          <h1 style="font-size:2rem; font-weight:800; margin-bottom:24px;">Deploying Bot</h1>
          <div class="glass" style="padding:32px; max-width:720px; margin:0 auto;">
            <div class="step-indicator">
              ${steps.map((label, idx) => {
                let cls = 'step';
                if (idx < current) cls += ' done';
                else if (idx === current) cls += ' active';
                else if (current === steps.length - 1 && idx === steps.length - 1) cls += ' done';
                if (error && idx === current) cls += ' error';
                const icon = idx < current ? '✓' : (idx === current && error ? '✕' : (idx + 1));
                return `<div class="${cls}"><div class="step-icon">${icon}</div><span class="step-label">${label}</span></div>`;
              }).join('')}
            </div>

            ${success ? `
              <div class="text-center" style="padding:20px 0;">
                <i class="ph-fill ph-check-circle" style="font-size:4rem; color:var(--success);"></i>
                <h2 style="margin:12px 0;">Bot Deployed Successfully! 🎉</h2>
                <p class="text-muted">Your bot is now live and accepting webhooks.</p>
                <div style="display:flex; gap:12px; justify-content:center; margin-top:20px;">
                  <button class="btn btn--primary" data-route="/bots">View Bots</button>
                  <button class="btn btn--secondary" onclick="navigateTo('/create')">Deploy Another</button>
                </div>
              </div>
            ` : error ? `
              <div class="text-center" style="padding:20px 0;">
                <i class="ph-fill ph-warning-octagon" style="font-size:4rem; color:var(--danger);"></i>
                <h2 style="margin:12px 0;">Deployment Failed</h2>
                <p class="text-muted" style="color:var(--danger);">${error}</p>
                <button class="btn btn--primary mt-4" onclick="navigateTo('/create')">Try Again</button>
              </div>
            ` : `
              <div class="text-center" style="padding:20px 0;">
                <div class="spinner" style="margin:0 auto;"></div>
                <p class="text-muted mt-4">Please wait while we set up your bot...</p>
              </div>
            `}
          </div>
        `;
      }

      // Normal deploy form
      return `

        <form class="glass" style="max-width:720px; padding:32px;" onsubmit="createBot(event)">

                <option value="JS">JavaScript</option>
                <option value="PY">Python</option>
              </select>
            </div>
          </div>
          <div class="input-group">
            <label>Telegram Bot Token</label>
            <div class="input-wrapper">
              <input id="botToken" type="password" class="input-control input-control--with-icon" placeholder="123456:ABC-DEF1234ghIkl-zyx" required />
              <button type="button" class="toggle-vis" onclick="toggleTokenVisibility()">
                <i class="ph ph-eye"></i>
              </button>
            </div>
            <div class="helper">Get your token from @BotFather on Telegram.</div>
          </div>
          <div class="input-group">
            <label>Bot Code</label>
            <textarea id="botCode" class="input-control code-editor" required>${codeTemplates.JS}</textarea>

          break;
        case '/dashboard': content = wrapApp(renderDashboard()); break;
        case '/bots': content = wrapApp(renderBots()); break;
        case '/bot-detail': content = wrapApp(renderBotDetail()); break;
        case '/create': content = wrapApp(renderDeploy()); break;
        case '/pricing': content = wrapApp(renderPricing()); break;
        case '/profile': content = wrapApp(renderProfile()); break;
        case '/admin': content = wrapApp(renderAdmin()); break;
        case '/admin-login': content = renderAdminLogin(); break;
        default: content = `<div class="text-center" style="padding:80px 20px;"><h2>404 – Page not found</h2></div>`;
      }
      app.innerHTML = content;

      // re-run any side effects: if deploy form is shown, set default code
      if (state.currentRoute === '/create' && state.deployCurrentStep === -1) {
        const codeArea = document.getElementById('botCode');
        if (codeArea) codeArea.value = codeTemplates.JS;
      }
    }

    // expose render globally
    window.render = render;

    // ==========================================================
    // INIT
    // ==========================================================
    window.addEventListener('load', () => {
      handleHashRoute();
      window.toggleLoader(true);
    });

    // Handle bot detail route from clicks
    document.addEventListener('click', (e) => {
      const detailLink = e.target.closest('[data-bot-detail]');
      if (detailLink) {
        e.preventDefault();
        const id = detailLink.dataset.botDetail;
        navigateTo(`/bot/${id}`);
      }
    });

  </script>
</body>
</html>
