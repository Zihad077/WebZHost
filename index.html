<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebZHost</title>
<style>
:root{--bg:#0a1020;--card:#111a30;--line:#22304f;--tx:#e6ecf8;--mu:#8b9bbd;--ac:#4f8cff;--ok:#2ecc8f;--wa:#f5b942;--er:#ff5d6c}
[data-theme=light]{--bg:#f4f6fb;--card:#fff;--line:#d9e0ee;--tx:#14203a;--mu:#5d6b88;--ac:#2563eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif}
a{color:var(--ac);text-decoration:none}#app{display:flex;min-height:100vh}
nav{width:220px;background:var(--card);border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
nav b{font-size:18px;margin-bottom:12px}nav a{padding:8px 10px;border-radius:8px;color:var(--mu)}nav a.on,nav a:hover{background:var(--bg);color:var(--tx)}
main{flex:1;padding:24px;max-width:1000px;min-width:0}h1{margin:0 0 16px;font-size:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.grid .card{margin:0}.n{font-size:26px;font-weight:700}
button,input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
button{cursor:pointer;background:var(--ac);border-color:var(--ac);color:#fff}button.sec{background:var(--bg);color:var(--tx);border-color:var(--line)}button.dan{background:var(--er);border-color:var(--er)}button:disabled{opacity:.5}
textarea{width:100%;min-height:320px;font:13px/1.5 ui-monospace,monospace}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.sp{flex:1}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}.tabs a{padding:8px 12px;color:var(--mu)}.tabs a.on{color:var(--tx);border-bottom:2px solid var(--ac)}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mu)}.error{color:var(--er)}.warning{color:var(--wa)}.info{color:var(--mu)}
.li{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}.li:last-child{border:0}pre{white-space:pre-wrap;word-break:break-word;margin:0;font-size:13px}
#toast{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:9}#toast div{background:var(--card);border:1px solid var(--line);padding:10px 14px;border-radius:8px}
.login{max-width:360px;margin:12vh auto;padding:16px}.login input{width:100%;margin-bottom:8px}
@media(max-width:760px){#app{flex-direction:column}nav{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center}nav b{margin:0 8px 0 0}main{padding:16px}}
</style>
</head>
<body><div id="app"></div><div id="toast" role="status" aria-live="polite"></div>
<script src="config.js"></script><script type="module" src="app.js"></script></body></html>
