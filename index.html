<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebzHost — Next‑Gen Bot Hosting</title>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        /* ---------- ROOT VARIABLES ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-deep: #030712;
            --bg-surface: #0f172a;
            --bg-card: rgba(15, 23, 42, 0.7);
            --border-subtle: rgba(148, 163, 184, 0.12);
            --border-glow: rgba(99, 102, 241, 0.5);
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
            --primary: #818cf8;
            --primary-dark: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --cyan: #22d3ee;
            --success: #34d399;
            --warning: #fbbf24;
            --danger: #f87171;
            --pink: #e879f9;
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --shadow-card: 0 20px 40px -12px rgba(0, 0, 0, 0.7);
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.6;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        button {
            cursor: pointer;
            border: none;
            background: none;
            font-family: inherit;
        }
        input,
        select,
        textarea {
            font-family: inherit;
            outline: none;
        }

        /* ---------- AMBIENT GLOW ---------- */
        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            z-index: 0;
        }
        .glow-orb--1 {
            width: 600px;
            height: 600px;
            top: -200px;
            left: -100px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.2), transparent 70%);
            animation: floatOrb 12s ease-in-out infinite alternate;
        }
        .glow-orb--2 {
            width: 500px;
            height: 500px;
            bottom: -150px;
            right: -100px;
            background: radial-gradient(circle, rgba(34, 211, 238, 0.15), transparent 70%);
            animation: floatOrb 16s ease-in-out infinite alternate-reverse;
        }
        @keyframes floatOrb {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(40px, 30px) scale(1.15);
            }
        }

        /* ---------- SCROLLBAR ---------- */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-deep);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary-dark);
            border-radius: 10px;
        }

        /* ---------- GLASS CARD ---------- */
        .glass {
            background: var(--bg-card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius);
            box-shadow: var(--shadow-card);
            transition: var(--transition);
        }
        .glass:hover {
            border-color: var(--border-glow);
            transform: translateY(-3px);
        }

        /* ---------- BUTTONS ---------- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 28px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.95rem;
            transition: var(--transition);
            border: 1px solid transparent;
            letter-spacing: 0.3px;
        }
        .btn--primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            box-shadow: 0 6px 24px var(--primary-glow);
        }
        .btn--primary:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 12px 32px var(--primary-glow);
        }
        .btn--secondary {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--border-subtle);
            color: var(--text-secondary);
        }
        .btn--secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.25);
        }
        .btn--danger {
            background: rgba(248, 113, 113, 0.12);
            color: var(--danger);
            border-color: rgba(248, 113, 113, 0.25);
        }
        .btn--danger:hover {
            background: var(--danger);
            color: #fff;
        }
        .btn--success {
            background: rgba(52, 211, 153, 0.12);
            color: var(--success);
            border-color: rgba(52, 211, 153, 0.25);
        }
        .btn--success:hover {
            background: var(--success);
            color: #fff;
        }
        .btn--admin {
            background: linear-gradient(135deg, var(--pink), #d946ef);
            color: #fff;
        }
        .btn--admin:hover {
            transform: scale(1.04);
        }

        /* ---------- INPUTS ---------- */
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .input-control {
            width: 100%;
            padding: 14px 16px;
            background: rgba(3, 7, 18, 0.7);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: var(--transition);
        }
        .input-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }
        .code-editor {
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            line-height: 1.7;
            background: #020617;
            color: #7dd3fc;
            min-height: 220px;
            resize: vertical;
            border-color: rgba(56, 189, 248, 0.2);
        }

        /* ---------- BADGE ---------- */
        .badge {
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.4px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
        }
        .badge--active {
            background: rgba(52, 211, 153, 0.18);
            color: var(--success);
            border: 1px solid rgba(52, 211, 153, 0.3);
        }
        .badge--py {
            background: rgba(34, 211, 238, 0.15);
            color: var(--cyan);
            border: 1px solid rgba(34, 211, 238, 0.25);
        }
        .badge--js {
            background: rgba(251, 191, 36, 0.15);
            color: var(--warning);
            border: 1px solid rgba(251, 191, 36, 0.25);
        }

        /* ---------- TOAST ---------- */
        #toast-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 420px;
            width: 100%;
        }
        .toast {
            background: rgba(15, 23, 42, 0.96);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-subtle);
            padding: 16px 22px;
            border-radius: var(--radius-sm);
            box-shadow: 0 20px 40px -8px rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            gap: 14px;
            font-weight: 500;
            animation: slideInToast 0.3s ease;
        }
        @keyframes slideInToast {
            from {
                opacity: 0;
                transform: translateX(40px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* ---------- LOADER OVERLAY ---------- */
        .loader-overlay {
            position: fixed;
            inset: 0;
            background: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9998;
            flex-direction: column;
            gap: 20px;
        }
        .loader-overlay--visible {
            display: flex;
        }
        .spinner {
            width: 56px;
            height: 56px;
            border: 5px solid rgba(255, 255, 255, 0.06);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ---------- MODAL ---------- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(14px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            z-index: 99999;
        }
        .modal-overlay--visible {
            display: flex;
        }
        .modal-card {
            background: #0f172a;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius);
            padding: 40px;
            max-width: 540px;
            width: 100%;
            text-align: center;
            box-shadow: 0 50px 80px -20px #000;
            animation: modalPop 0.25s ease;
        }
        @keyframes modalPop {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* ---------- LAYOUT ---------- */
        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5%;
            background: rgba(3, 7, 18, 0.75);
            backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--border-subtle);
            z-index: 100;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            cursor: pointer;
        }
        .logo i {
            color: var(--primary);
            font-size: 2rem;
        }

        .app-layout {
            display: flex;
            height: 100vh;
            overflow: hidden;
            padding-top: 72px;
        }
        .sidebar {
            width: 280px;
            background: rgba(9, 13, 31, 0.96);
            border-right: 1px solid var(--border-subtle);
            padding: 28px 18px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow-y: auto;
            transition: var(--transition);
        }
        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            color: var(--text-secondary);
            border-radius: var(--radius-sm);
            margin-bottom: 4px;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 600;
            font-size: 0.95rem;
        }
        .sidebar-link:hover {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-primary);
        }
        .sidebar-link--active {
            background: rgba(99, 102, 241, 0.15);
            color: var(--primary);
            border-right: 3px solid var(--primary);
        }
        .sidebar-link--admin {
            color: var(--pink);
        }
        .sidebar-link--logout {
            color: var(--danger);
            margin-top: auto;
        }

        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 40px 44px;
            position: relative;
            z-index: 1;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 900px) {
            .sidebar {
                width: 0;
                padding: 0;
                border: none;
                overflow: hidden;
                flex-shrink: 0;
            }
            .sidebar--open {
                width: 280px;
                padding: 28px 18px;
                border-right: 1px solid var(--border-subtle);
                flex-shrink: 0;
            }
            .main-content {
                padding: 24px 18px;
            }
            .top-nav {
                padding: 0 4%;
            }
            .hamburger {
                display: flex !important;
            }
        }
        .hamburger {
            display: none;
            font-size: 1.8rem;
            color: var(--text-secondary);
            background: none;
            border: none;
            padding: 6px;
        }
        .hamburger:hover {
            color: #fff;
        }

        /* ---------- EXTRA UI ---------- */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .mt-4 {
            margin-top: 32px;
        }
        .mb-4 {
            margin-bottom: 32px;
        }
        .text-muted {
            color: var(--text-muted);
        }
        .text-center {
            text-align: center;
        }
        .w-full {
            width: 100%;
        }

        /* Landing page hero */
        .hero-title {
            font-size: 4.2rem;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -1.5px;
        }
        .hero-gradient {
            background: linear-gradient(135deg, var(--primary), var(--cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .mock-terminal {
            background: #020617;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 30px 60px -20px #000;
        }
        .mock-terminal-header {
            background: #0f172a;
            padding: 12px 18px;
            display: flex;
            gap: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .mock-dot {
            width: 13px;
            height: 13px;
            border-radius: 50%;
        }
        .mock-code {
            font-family: 'Fira Code', monospace;
            color: #7dd3fc;
            padding: 28px;
            font-size: 0.95rem;
            line-height: 1.7;
            white-space: pre-wrap;
            border-right: 2px solid var(--primary);
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            50% {
                border-color: transparent;
            }
        }

        .plan-card {
            border: 1px solid var(--border-subtle);
            transition: var(--transition);
        }
        .plan-card--featured {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.08);
            transform: scale(1.02);
        }
        .plan-card:hover {
            transform: translateY(-6px);
            border-color: var(--border-glow);
        }

        /* Bot card */
        .bot-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            padding: 18px 24px;
            border-bottom: 1px solid var(--border-subtle);
        }
        .bot-item:last-child {
            border-bottom: none;
        }
        .bot-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .bot-url {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-family: 'Fira Code', monospace;
            word-break: break-all;
        }
        .bot-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        @media (max-width: 600px) {
            .hero-title {
                font-size: 2.6rem;
            }
            .grid-2 {
                grid-template-columns: 1fr;
            }
            .bot-item {
                flex-direction: column;
                align-items: stretch;
            }
            .bot-actions {
                justify-content: flex-start;
            }
            .modal-card {
                padding: 24px;
            }
        }
    </style>
</head>
<body>

    <!-- Ambient Glows -->
    <div class="glow-orb glow-orb--1"></div>
    <div class="glow-orb glow-orb--2"></div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- Loader -->
    <div id="loader" class="loader-overlay">
        <div class="spinner"></div>
        <p style="color:var(--text-secondary); font-weight:500;">Loading…</p>
    </div>

    <!-- Error Modal -->
    <div id="error-modal" class="modal-overlay">
        <div class="modal-card" style="border-color:var(--danger);">
            <i class="ph-fill ph-warning-octagon" style="font-size:4rem; color:var(--danger);"></i>
            <h2 id="error-modal-title" style="font-size:1.6rem; font-weight:800; margin:16px 0 8px; color:#fff;">Error</h2>
            <div id="error-modal-body" style="background:rgba(0,0,0,0.5); border:1px solid rgba(248,113,113,0.2); padding:18px; border-radius:var(--radius-sm); color:#fca5a5; font-family:'Fira Code',monospace; font-size:0.85rem; text-align:left; margin:20px 0;">Details…</div>
            <button class="btn btn--danger w-full" onclick="closeErrorModal()" style="padding:14px;">Dismiss</button>
        </div>
    </div>

    <!-- Root App -->
    <div id="app"></div>

    <script type="module">
        // ============================================================
        //  IMPORTS
        // ============================================================
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import {
            getAuth,
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword,
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import {
            getFirestore,
            collection,
            addDoc,
            getDocs,
            query,
            where,
            deleteDoc,
            doc,
            setDoc,
            updateDoc,
            serverTimestamp,
            getDoc
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ============================================================
        //  FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyCJEMrW8FADRRmKD1WSEOsE9lVoOWoxYtU",
            authDomain: "bothostz.firebaseapp.com",
            projectId: "bothostz",
            storageBucket: "bothostz.firebasestorage.app",
            messagingSenderId: "506392978902",
            appId: "1:506392978902:web:7e962842404f5e91d07077"
        };

        const appFirebase = initializeApp(firebaseConfig);
        const auth = getAuth(appFirebase);
        const db = getFirestore(appFirebase, "webzhost");

        const DOMAIN = "https://webzhost.vercel.app";

        // ============================================================
        //  CODE TEMPLATES (FIXED)
        // ============================================================
        const codeTemplates = {
            JS: `const express = require('express');
        const app = express();
        app.use(express.json());

        app.post('/webhook', (req, res) => {
          const { message } = req.body;
          if (message && message.text === '/start') {
            // reply logic
          }
          res.sendStatus(200);
        });

        module.exports = app;`,

            PY: `from flask import Flask, request
        app = Flask(__name__)

        @app.route('/webhook', methods=['POST'])
        def webhook():
            data = request.get_json()
            if data and 'message' in data:
                # handle /start etc.
                pass
            return 'OK', 200`
        };

        // ============================================================
        //  STATE
        // ============================================================
        const state = {
            user: null,
            userProfile: { plan: 'Free' },
            isAdmin: false,
            currentRoute: '/',
            bots: [],
            plans: [],
            paymentSettings: { bkash: 'বিকাশ নম্বর দিন', nagad: 'নগদ নম্বর দিন', binance: 'বিনান্স আইডি দিন' },
            allBots: [],
            allUsers: [],
            payments: []
        };

        // ============================================================
        //  UTILITY FUNCTIONS (GLOBAL)
        // ============================================================
        window.showToast = (msg, type = 'success') => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            const icon = type === 'success' ? 'ph-check-circle' : type === 'error' ? 'ph-warning' : 'ph-info';
            const color = type === 'success' ? 'var(--success)' : type === 'error' ? 'var(--danger)' : 'var(--warning)';
            toast.innerHTML = `<i class="ph-fill ${icon}" style="color:${color}; font-size:1.6rem;"></i><span>${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3500);
        };

        window.toggleLoader = (show) => {
            document.getElementById('loader').classList.toggle('loader-overlay--visible', show);
        };

        window.showBigError = (title, message) => {
            window.toggleLoader(false);
            document.getElementById('error-modal-title').textContent = title;
            document.getElementById('error-modal-body').textContent = message;
            document.getElementById('error-modal').classList.add('modal-overlay--visible');
        };

        window.closeErrorModal = () => {
            document.getElementById('error-modal').classList.remove('modal-overlay--visible');
        };

        window.copyText = (text) => {
            navigator.clipboard.writeText(text).then(() => {
                showToast('Copied to clipboard!', 'success');
            }).catch(() => {
                showToast('Failed to copy', 'error');
            });
        };

        window.handleLangChange = (val) => {
            const codeArea = document.getElementById('botCode');
            if (codeArea) {
                codeArea.value = val === 'PY' ? codeTemplates.PY : codeTemplates.JS;
            }
        };

        window.navigateTo = (route) => {
            state.currentRoute = route;
            render();
            window.scrollTo(0, 0);
            // close sidebar on mobile
            document.querySelector('.sidebar')?.classList.remove('sidebar--open');
        };

        // ============================================================
        //  AUTH NAVIGATION
        // ============================================================
        document.addEventListener('click', (e) => {
            const link = e.target.closest('[data-route]');
            if (link) {
                e.preventDefault();
                navigateTo(link.dataset.route);
            }
        });

        function handleHashRoute() {
            if (window.location.hash === '#admin') {
                if (state.isAdmin) navigateTo('/admin');
                else navigateTo('/admin-login');
            }
        }
        window.addEventListener('hashchange', handleHashRoute);

        // ============================================================
        //  FIREBASE HELPERS
        // ============================================================
        const withTimeout = (promise, ms = 8000) =>
            Promise.race([promise, new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout')), ms))]);

        async function fetchGlobalData() {
            try {
                const pSnap = await getDocs(collection(db, "plans"));
                state.plans = [];
                pSnap.forEach(d => state.plans.push({ id: d.id, ...d.data() }));
                const sSnap = await getDoc(doc(db, "settings", "payments"));
                if (sSnap.exists()) state.paymentSettings = sSnap.data();
            } catch (e) {
                console.warn('Global data fetch:', e);
            }
        }

        async function fetchUserData() {
            try {
                const snap = await getDocs(query(collection(db, "users"), where("uid", "==", state.user.uid)));
                if (!snap.empty) {
                    state.userProfile = snap.docs[0].data();
                } else {
                    state.userProfile = { uid: state.user.uid, email: state.user.email, plan: 'Free' };
                    await setDoc(doc(db, "users", state.user.uid), state.userProfile);
                }
            } catch (e) { console.warn(e); }
        }

        async function fetchBots() {
            try {
                const q = query(collection(db, "bots"), where("userId", "==", state.user.uid));
                const snap = await withTimeout(getDocs(q));
                state.bots = [];
                snap.forEach(d => state.bots.push({ id: d.id, ...d.data() }));
            } catch (e) { console.warn(e); }
        }

        async function fetchAdminData() {
            try {
                const bSnap = await getDocs(collection(db, "bots"));
                state.allBots = [];
                bSnap.forEach(d => state.allBots.push(d.data()));
                const uSnap = await getDocs(collection(db, "users"));
                state.allUsers = [];
                uSnap.forEach(d => state.allUsers.push(d.data()));
                const pSnap = await getDocs(collection(db, "payments"));
                state.payments = [];
                pSnap.forEach(d => state.payments.push({ id: d.id, ...d.data() }));
            } catch (e) { console.warn(e); }
        }

        //  AUTH STATE
        // ============================================================
        onAuthStateChanged(auth, async (user) => {
            await fetchGlobalData();
            if (user) {
                state.user = user;
                await fetchUserData();
                await fetchBots();
                handleHashRoute();
                if (['/', '/login', '/register'].includes(state.currentRoute)) navigateTo('/dashboard');
            } else {
                state.user = null;
                state.bots = [];
                state.isAdmin = false;
                if (state.currentRoute !== '/admin-login') navigateTo('/');

            window.toggleLoader(false);
            render();

        window.handleAuth = async (e, isLogin) => {
            e.preventDefault();
            window.toggleLoader(true);

                const pass = e.target.password.value;
                if (isLogin) {
                    await signInWithEmailAndPassword(auth, email, pass);
                } else {
                    await createUserWithEmailAndPassword(auth, email, pass);
                }
                showToast(isLogin ? 'Welcome back!' : 'Account created!');

                showBigError('Authentication Failed', err.message);
            } finally {
                window.toggleLoader(false);
            }

            await signOut(auth);

        // ============================================================
        //  BOT OPERATIONS
        // ============================================================
        window.createBot = async (e) => {
            e.preventDefault();
            const planName = state.userProfile?.plan || 'Free';
            const userPlan = state.plans.find(p => p.name.toLowerCase() === planName.toLowerCase()) || { maxBots: 3 };

            if (state.bots.length >= userPlan.maxBots) {
                return showBigError('Limit Reached', `Your "${planName}" plan allows max ${userPlan.maxBots} bots. Please upgrade.`);
            }

            const name = document.getElementById('botName').value.trim();
            const token = document.getElementById('botToken').value.trim();
            const lang = document.getElementById('botLang').value;
            const code = document.getElementById('botCode').value;

            if (!name || !token || !code) {
                return showBigError('Missing Fields', 'Please fill all required fields.');
            }

            window.toggleLoader(true);
            try {
                const docRef = await addDoc(collection(db, "bots"), {
                    userId: state.user.uid,
                    name,
                    token,
                    lang,
                    code,
                    status: 'active',
                    createdAt: serverTimestamp()
                });

                const webhookUrl = `${DOMAIN}/api/${lang === 'PY' ? 'webhook_python' : 'webhook'}?botId=${docRef.id}`;
                try {
                    await fetch(`https://api.telegram.org/bot${token}/setWebhook?url=${webhookUrl}`);
                } catch (whErr) {
                    console.warn('Webhook set failed:', whErr);
                }

                showToast('Bot deployed successfully!');
                await fetchBots();
                navigateTo('/bots');
            } catch (err) {
                showBigError('Deploy Failed', err.message);
            } finally {
                window.toggleLoader(false);
            }
        };

        window.deleteBot = async (id, token) => {
            if (!confirm('Delete this bot permanently?')) return;
            window.toggleLoader(true);
            try {
                // Remove webhook from Telegram
                if (token) {
                    try {
                        await fetch(`https://api.telegram.org/bot${token}/deleteWebhook`);
                    } catch (e) { /* ignore */ }
                }
                await deleteDoc(doc(db, "bots", id));
                showToast('Bot removed');
                await fetchBots();
                render();
            } catch (err) {
                showBigError('Delete Error', err.message);
            } finally {
                window.toggleLoader(false);
            }
        };

                            <div class="glass" style="padding:20px; text-align:center;">
                                <h3 style="font-size:1.6rem;">${state.allBots.length}</h3>
                                <p class="text-muted">Bots</p>
                            </div>
                            <div class="glass" style="padding:20px; text-align:center;">
                                <h3 style="font-size:1.6rem;">${state.payments.filter(p => p.status === 'pending').length}</h3>
                                <p class="text-muted">Pending Payments</p>
                            </div>
                        </div>

                        <h2 class="mb-4">Pending Payments</h2>
                        <div class="glass" style="padding:0; overflow:hidden; margin-bottom:40px;">
                            ${state.payments.filter(p => p.status === 'pending').length === 0 ? `
                                <div style="padding:30px; text-align:center; color:var(--text-muted);">All clear – no pending payments.</div>
                            ` : state.payments.filter(p => p.status === 'pending').map(p => `
                                <div class="bot-item">
                                    <div>
                                        <strong>${p.userEmail}</strong>
                                        <span style="margin-left:12px; font-size:0.85rem; color:var(--text-secondary);">Plan: ${p.planName} · Trx: ${p.trxId}</span>
                                    </div>
                                    <button class="btn btn--success" onclick="approvePayment('${p.id}', '${p.userId}', '${p.planName}')">
                                        <i class="ph ph-check"></i> Approve
                                    </button>
                                </div>
                            `).join('')}
                        </div>

                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:28px;">
                            <form class="glass" style="padding:28px;" onsubmit="adminUpdateSettings(event)">
                                <h3 style="margin-bottom:16px; color:var(--warning);">💳 Payment Numbers</h3>
                                <div class="input-group"><label>bKash</label><input name="bkash" class="input-control" value="${state.paymentSettings.bkash}" /></div>
                                <div class="input-group"><label>Nagad</label><input name="nagad" class="input-control" value="${state.paymentSettings.nagad}" /></div>
                                <div class="input-group"><label>Binance</label><input name="binance" class="input-control" value="${state.paymentSettings.binance}" /></div>
                                <button class="btn btn--admin w-full" style="padding:14px;">Update Numbers</button>
                            </form>

                            <form class="glass" style="padding:28px;" onsubmit="adminAddPlan(event)">
                                <h3 style="margin-bottom:16px; color:var(--cyan);">➕ New Plan</h3>
                                <div class="input-group"><label>Name</label><input name="pName" class="input-control" required /></div>
                                <div class="input-group"><label>Description</label><input name="pDesc" class="input-control" required /></div>
                                <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                                    <div class="input-group"><label>Price (BDT)</label><input type="number" name="pPrice" class="input-control" required /></div>
                                    <div class="input-group"><label>Max Bots</label><input type="number" name="pLimit" class="input-control" required /></div>
                                </div>
                                <button class="btn btn--primary w-full" style="padding:14px;">Create Plan</button>
                            </form>
                        </div>
                    `);
                    break;
                default:
                    app.innerHTML = `<div class="text-center" style="padding:80px 20px;"><h2>404 – Page not found</h2></div>`;
            }
        }

        // ============================================================
        //  INIT
        // ============================================================
        window.addEventListener('load', () => {
            handleHashRoute();
            window.toggleLoader(true);
            // Pre-fill code editor language handler
            document.addEventListener('change', (e) => {
                if (e.target.id === 'botLang') handleLangChange(e.target.value);
            });
        });

        // Expose render for after async operations
        window.render = render;

        // Fix for mobile hamburger – we use inline onclick already
    </script>
</body>
</html>
