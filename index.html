<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebzHost — Dynamic SaaS Bot Hosting & Admin Engine</title>
    
    <!-- Fonts & Phosphor Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            --bg-dark: #020617;
            --bg-surface: #090d1f;
            --bg-card: rgba(15, 23, 42, 0.7);
            --border: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(99, 102, 241, 0.5);
            
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            
            --primary: #6366f1;
            --primary-light: #818cf8;
            --primary-glow: rgba(99, 102, 241, 0.3);
            --cyan: #06b6d4;
            --success: #10b981;
            --danger: #f43f5e;
            --warning: #f59e0b;
            --admin-pink: #ec4899;
            
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-primary); min-height: 100vh; overflow-x: hidden; }
        a { text-decoration: none; color: inherit; }
        button { cursor: pointer; border: none; background: none; font-family: inherit; }
        input, select, textarea { font-family: inherit; }

        .glow-orb-1 {
            position: fixed; top: -150px; left: 50%; transform: translateX(-50%);
            width: 750px; height: 400px; background: radial-gradient(circle, rgba(99, 102, 241, 0.2) 0%, rgba(6, 182, 212, 0.05) 50%, rgba(0,0,0,0) 80%);
            pointer-events: none; z-index: 0; filter: blur(70px);
        }

        .glass-card {
            background: var(--bg-card); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border); border-radius: var(--radius-md); padding: 24px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6); transition: var(--transition);
        }
        .glass-card:hover { border-color: var(--border-glow); }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 11px 20px; border-radius: var(--radius-sm); font-weight: 600; font-size: 0.9rem;
            transition: var(--transition); border: 1px solid transparent; cursor: pointer;
        }
        .btn-primary { background: linear-gradient(135deg, var(--primary), #4338ca); color: white; box-shadow: 0 4px 20px var(--primary-glow); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(99, 102, 241, 0.5); }
        .btn-secondary { background: rgba(255, 255, 255, 0.05); border-color: var(--border); color: var(--text-primary); }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); }
        .btn-danger { background: rgba(244, 63, 94, 0.12); border-color: rgba(244, 63, 94, 0.25); color: var(--danger); }
        .btn-danger:hover { background: var(--danger); color: white; }
        .btn-admin { background: linear-gradient(135deg, var(--admin-pink), #be185d); color: white; box-shadow: 0 0 20px rgba(236, 72, 153, 0.3); }

        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; }
        .input-control {
            width: 100%; padding: 13px 16px; background: rgba(2, 6, 23, 0.7);
            border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-primary);
            transition: var(--transition); font-size: 0.92rem;
        }
        .input-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 20px var(--primary-glow); }
        .code-editor { font-family: 'Fira Code', monospace; font-size: 0.88rem; line-height: 1.6; background: #020617; color: #38bdf8; min-height: 220px; }

        .badge { padding: 4px 12px; border-radius: 30px; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.5px; display: inline-flex; align-items: center; gap: 6px; }
        .badge-active { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge-py { background: rgba(6, 182, 212, 0.15); color: var(--cyan); border: 1px solid rgba(6, 182, 212, 0.3); }
        .badge-js { background: rgba(245, 158, 11, 0.15); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.3); }
        .badge-plan { background: rgba(99, 102, 241, 0.2); color: var(--primary-light); border: 1px solid rgba(99, 102, 241, 0.3); }

        .top-nav {
            position: fixed; top: 0; left: 0; right: 0; height: 75px; display: flex; align-items: center; justify-content: space-between;
            padding: 0 5%; background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(24px); border-bottom: 1px solid var(--border); z-index: 100;
        }
        .logo { font-size: 1.35rem; font-weight: 800; display: flex; align-items: center; gap: 10px; background: linear-gradient(135deg, #fff 30%, var(--text-secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo i { color: var(--primary); font-size: 1.7rem; -webkit-text-fill-color: initial; }

        .app-layout { display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 280px; background: rgba(9, 13, 31, 0.95); border-right: 1px solid var(--border); padding: 32px 18px; display: flex; flex-direction: column; z-index: 10; }
        .sidebar-link {
            display: flex; align-items: center; gap: 12px; padding: 13px 16px; color: var(--text-secondary);
            border-radius: var(--radius-sm); margin-bottom: 6px; cursor: pointer; transition: var(--transition); font-size: 0.92rem; font-weight: 600;
        }
        .sidebar-link:hover, .sidebar-link.active { background: rgba(255, 255, 255, 0.05); color: var(--text-primary); }
        .sidebar-link.active { background: rgba(99, 102, 241, 0.15); color: var(--primary-light); border-right: 3px solid var(--primary); }
        .sidebar-link.admin-link.active { background: rgba(236, 72, 153, 0.15); color: var(--admin-pink); border-right: 3px solid var(--admin-pink); }

        .main-content { flex: 1; overflow-y: auto; padding: 36px; position: relative; z-index: 1; margin-top: 10px; }

        #toast-container { position: fixed; bottom: 30px; right: 30px; z-index: 9999; display: flex; flex-direction: column; gap: 12px; }
        .toast { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(20px); border: 1px solid var(--border); padding: 16px 24px; border-radius: var(--radius-md); display: flex; align-items: center; gap: 12px; font-size: 0.92rem; }

        .loader-overlay { position: fixed; inset: 0; background: rgba(2, 6, 23, 0.88); backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center; z-index: 9998; }
        .spinner { width: 46px; height: 46px; border: 4px solid rgba(255,255,255,0.08); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error-modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.88); backdrop-filter: blur(16px); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 99999; }
        .error-modal-card { background: #0f172a; border: 2px solid var(--danger); border-radius: var(--radius-lg); padding: 36px; max-width: 580px; width: 100%; text-align: center; }
        .error-modal-body { background: #020617; border: 1px solid rgba(244, 63, 94, 0.3); padding: 18px; border-radius: var(--radius-sm); color: #fca5a5; font-family: 'Fira Code', monospace; font-size: 0.88rem; text-align: left; word-break: break-all; max-height: 220px; overflow-y: auto; margin: 24px 0; }

        @media (max-width: 768px) {
            .app-layout { flex-direction: column; height: auto; overflow: visible; }
            .sidebar { width: 100%; height: auto; padding: 16px; border-right: none; border-bottom: 1px solid var(--border); }
            .sidebar-nav { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
            .sidebar-link { white-space: nowrap; margin-bottom: 0; padding: 10px 14px; font-size: 0.85rem; }
            .main-content { padding: 20px 14px; margin-top: 0; }
            .top-nav { padding: 0 16px; height: 65px; }
        }
    </style>
</head>
<body>

    <div class="glow-orb-1"></div>
    <div id="toast-container"></div>
    <div id="loader" class="loader-overlay" style="display:none;"><div class="spinner"></div></div>

    <!-- Error Modal Window -->
    <div id="error-modal" class="error-modal-overlay" style="display:none;">
        <div class="error-modal-card">
            <i class="ph-fill ph-warning-octagon" style="font-size: 3.8rem; color: var(--danger);"></i>
            <h2 id="error-modal-title" style="font-size:1.5rem; font-weight:800; margin-top:14px; color:#fff;">System Error</h2>
            <div id="error-modal-body" class="error-modal-body">Error details...</div>
            <button class="btn btn-danger" style="width:100%; padding:14px; font-weight:700;" onclick="closeErrorModal()">Close Window</button>
        </div>
    </div>

    <div id="app"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, query, where, deleteDoc, doc, setDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCJEMrW8FADRRmKD1WSEOsE9lVoOWoxYtU",
            authDomain: "bothostz.firebaseapp.com",
            projectId: "bothostz",
            storageBucket: "bothostz.firebasestorage.app",
            messagingSenderId: "506392978902",
            appId: "1:506392978902:web:7e962842404f5e91d07077"
        };

        const appFirebase = initializeApp(firebaseConfig);
        const auth = getAuth(appFirebase);
        
        // Connect to custom named database 'webzhost'
        const db = getFirestore(appFirebase, "webzhost");

        const DOMAIN = "https://webzhost.vercel.app";

        // Global State Engine
        const state = { 
            user: null, 
            userProfile: { plan: 'Free' },
            isAdmin: false, 
            currentRoute: '/', 
            bots: [], 
            allBots: [],
            allUsers: [],
            payments: [],
            plans: [
                { id: 'p_free', name: 'Free', price: 0, maxBots: 3 },
                { id: 'p_standard', name: 'Standard', price: 99, maxBots: 10 },
                { id: 'p_unlimited', name: 'Unlimited', price: 999, maxBots: 9999 }
            ]
        };

        const withTimeout = (promise, ms = 6000) => {
            return Promise.race([
                promise,
                new Promise((_, reject) =>
                    setTimeout(() => reject(new Error("Database Connection Timed Out.")), ms)
                )
            ]);
        };

        window.showBigError = (title, message) => {
            window.toggleLoader(false);
            document.getElementById('error-modal-title').innerText = title;
            document.getElementById('error-modal-body').innerText = message;
            document.getElementById('error-modal').style.display = 'flex';
        };

        window.closeErrorModal = () => {
            document.getElementById('error-modal').style.display = 'none';
            window.toggleLoader(false);
        };

        window.addEventListener('unhandledrejection', (event) => {
            const reason = event.reason ? (event.reason.message || JSON.stringify(event.reason)) : "Unknown Error";
            window.showBigError("Async Error", reason);
        });

        // URL Hash Detector for /#admin
        function handleHashRoute() {
            if (window.location.hash === '#admin') {
                if (state.isAdmin) navigateTo('/admin');
                else navigateTo('/admin-login');
            }
        }
        window.addEventListener('hashchange', handleHashRoute);

        const codeTemplates = {
            JS: `// JavaScript Bot Logic\nconst text = update.message.text;\nif (text === '/start') {\n    reply("Hello! Welcome to WebzHost JS Engine 🚀");\n} else {\n    reply("You typed: " + text);\n}`,
            PY: `# Python Bot Logic\ntext = update['message']['text']\nif text == '/start':\n    reply("Hello! Welcome to WebzHost Python Engine 🐍")\nelse:\n    reply(f"You typed: {text}")`
        };

        window.showToast = (msg, type = 'success') => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<i class="ph-fill ph-check-circle" style="color:var(--success); font-size:1.3rem;"></i> <span>${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3200);
        }

        window.toggleLoader = (show) => document.getElementById('loader').style.display = show ? 'flex' : 'none';
        window.copyText = (text) => { navigator.clipboard.writeText(text); showToast('Copied to clipboard!'); }
        window.navigateTo = (route) => { state.currentRoute = route; render(); window.scrollTo(0, 0); }

        document.body.addEventListener('click', e => {
            const link = e.target.closest('[data-route]');
            if (link) { e.preventDefault(); navigateTo(link.dataset.route); }
        });

        window.handleLangChange = (lang) => {
            const codeEditor = document.getElementById('botCode');
            if (codeEditor) codeEditor.value = codeTemplates[lang];
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                state.user = user;
                await fetchUserData();
                await fetchBots();
                await fetchPlans();
                handleHashRoute();
                if(['/', '/login', '/register'].includes(state.currentRoute)) navigateTo('/dashboard');
            } else {
                state.user = null; state.bots = [];
                if(state.currentRoute !== '/admin-login') navigateTo('/');
            }
            toggleLoader(false);
            render();
        });

        async function fetchUserData() {
            if(!state.user) return;
            try {
                const snap = await getDocs(query(collection(db, "users"), where("uid", "==", state.user.uid)));
                if(!snap.empty) state.userProfile = snap.docs[0].data();
                else {
                    state.userProfile = { uid: state.user.uid, email: state.user.email, plan: 'Free' };
                    await setDoc(doc(db, "users", state.user.uid), state.userProfile);
                }
            } catch (err) { console.error("User Sync Error:", err); }
        }

        async function fetchBots() {
            if(!state.user) return;
            try {
                const q = query(collection(db, "bots"), where("userId", "==", state.user.uid));
                const snap = await withTimeout(getDocs(q), 6000);
                state.bots = [];
                snap.forEach((doc) => state.bots.push({ id: doc.id, ...doc.data() }));
            } catch (err) { console.error("Fetch Error:", err); }
        }

        async function fetchPlans() {
            try {
                const snap = await getDocs(collection(db, "plans"));
                if(!snap.empty) {
                    state.plans = [];
                    snap.forEach((doc) => state.plans.push({ id: doc.id, ...doc.data() }));
                }
            } catch(e) {}
        }

        window.handleAuth = async (e, isLogin) => {
            e.preventDefault(); toggleLoader(true);
            try {
                if (isLogin) await signInWithEmailAndPassword(auth, e.target.email.value, e.target.password.value);
                else await createUserWithEmailAndPassword(auth, e.target.email.value, e.target.password.value);
                showToast('Welcome to WebzHost!');
            } catch (err) { 
                window.showBigError("Auth Error", err.message);
            } finally {
                toggleLoader(false);
            }
        }

        // Admin Master Auth
        window.adminLogin = async (e) => {
            e.preventDefault();
            if(e.target.code.value === '#Zihad077') {
                state.isAdmin = true;
                window.location.hash = 'admin';
                showToast('Master Admin Console Activated');
                await fetchAdminData();
                navigateTo('/admin');
            } else showToast('Invalid Passcode', 'error');
        }

        async function fetchAdminData() {
            try {
                // Fetch All Bots
                const bSnap = await getDocs(collection(db, "bots"));
                state.allBots = [];
                bSnap.forEach(d => state.allBots.push({ id: d.id, ...d.data() }));

                // Fetch All Users
                const uSnap = await getDocs(collection(db, "users"));
                state.allUsers = [];
                uSnap.forEach(d => state.allUsers.push({ id: d.id, ...d.data() }));

                // Fetch All Payments
                const pSnap = await getDocs(collection(db, "payments"));
                state.payments = [];
                pSnap.forEach(d => state.payments.push({ id: d.id, ...d.data() }));
            } catch(err) { console.error(err); }
        }

        // Deploy Bot (Strict Plan Enforcement)
        window.createBot = async (e) => {
            e.preventDefault();
            if (!state.user) return window.showBigError("Auth Missing", "Please log in first.");

            const currentPlanName = state.userProfile?.plan || 'Free';
            const userPlan = state.plans.find(p => p.name.toLowerCase() === currentPlanName.toLowerCase()) || { maxBots: 3 };

            if (state.bots.length >= userPlan.maxBots) {
                return window.showBigError("Plan Limit Reached", `Your '${currentPlanName}' plan allows max ${userPlan.maxBots} bots. Please upgrade subscription.`);
            }

            const name = document.getElementById('botName').value.trim();
            const token = document.getElementById('botToken').value.trim();
            const lang = document.getElementById('botLang').value;
            const code = document.getElementById('botCode').value;

            toggleLoader(true);
            try {
                const docRef = await withTimeout(
                    addDoc(collection(db, "bots"), {
                        userId: state.user.uid, name, token, lang, code, status: 'active', createdAt: serverTimestamp()
                    }),
                    6000
                );

                const endpoint = lang === 'PY' ? '/api/webhook_python' : '/api/webhook';
                const webhookUrl = `${DOMAIN}${endpoint}?botId=${docRef.id}`;
                
                try { await fetch(`https://api.telegram.org/bot${token}/setWebhook?url=${webhookUrl}`); } catch (tgErr) {}

                showToast('Bot Deployed Successfully!');
                await fetchBots();
                navigateTo('/bots');
            } catch (err) {
                window.showBigError("Deploy Failed", err.message);
            } finally {
                toggleLoader(false);
            }
        }

        // Submit Payment Form
        window.submitPayment = async (e) => {
            e.preventDefault();
            toggleLoader(true);
            try {
                const planName = e.target.planName.value;
                const method = e.target.method.value;
                const trxId = e.target.trxId.value;

                await addDoc(collection(db, "payments"), {
                    userId: state.user.uid,
                    userEmail: state.user.email,
                    planName, method, trxId,
                    status: 'pending',
                    createdAt: serverTimestamp()
                });

                showToast('Payment submitted! Awaiting Admin Approval.');
                navigateTo('/dashboard');
            } catch(e) { window.showBigError("Payment Error", e.message); }
            finally { toggleLoader(false); }
        }

        // Admin Actions
        window.approvePayment = async (payId, userId, targetPlan) => {
            toggleLoader(true);
            try {
                await updateDoc(doc(db, "payments", payId), { status: 'approved' });
                await updateDoc(doc(db, "users", userId), { plan: targetPlan });
                showToast(`Payment Approved & User Upgraded to ${targetPlan}`);
                await fetchAdminData();
                render();
            } catch(e) { window.showBigError("Admin Error", e.message); }
            finally { toggleLoader(false); }
        }

        window.updatePlanSettings = async (planId, name, price, maxBots) => {
            toggleLoader(true);
            try {
                await setDoc(doc(db, "plans", planId), {
                    name, price: Number(price), maxBots: Number(maxBots)
                });
                showToast("Plan Updated Globally!");
                await fetchPlans();
                render();
            } catch(e) { window.showBigError("Admin Plan Error", e.message); }
            finally { toggleLoader(false); }
        }

        window.deleteBot = async (id) => {
            if(confirm('Delete bot?')) {
                toggleLoader(true);
                try {
                    await deleteDoc(doc(db, "bots", id));
                    showToast('Bot Deleted');
                    await fetchBots();
                    if(state.isAdmin) await fetchAdminData();
                    render();
                } catch(err) { window.showBigError("Delete Error", err.message); }
                finally { toggleLoader(false); }
            }
        }

        window.logout = async () => { await signOut(auth); state.isAdmin = false; window.location.hash = ''; }

        const wrapApp = (content) => `
            <div class="app-layout">
                <div class="sidebar">
                    <div class="logo" data-route="/dashboard" style="margin-bottom:28px;"><i class="ph-fill ph-paper-plane-tilt"></i> WebzHost</div>
                    <div class="sidebar-nav">
                        <div class="sidebar-link ${state.currentRoute==='/dashboard'?'active':''}" data-route="/dashboard"><i class="ph ph-squares-four"></i> Overview</div>
                        <div class="sidebar-link ${state.currentRoute==='/bots'?'active':''}" data-route="/bots"><i class="ph ph-robot"></i> My Bots</div>
                        <div class="sidebar-link ${state.currentRoute==='/create'?'active':''}" data-route="/create"><i class="ph ph-plus-circle"></i> Deploy Bot</div>
                        <div class="sidebar-link ${state.currentRoute==='/pricing'?'active':''}" data-route="/pricing"><i class="ph ph-credit-card"></i> Pricing</div>
                        ${state.isAdmin ? `<div class="sidebar-link admin-link ${state.currentRoute==='/admin'?'active':''}" data-route="/admin" style="color:var(--admin-pink);"><i class="ph ph-shield-check"></i> Master Admin</div>` : ''}
                    </div>
                    <div style="flex:1;"></div>
                    <div class="sidebar-link" style="color:var(--danger); margin-top:20px;" onclick="logout()"><i class="ph ph-sign-out"></i> Sign Out</div>
                </div>
                <div class="main-content">${content}</div>
            </div>
        `;

        function render() {
            const app = document.getElementById('app');
            if(['/dashboard', '/bots', '/create', '/pricing'].includes(state.currentRoute) && !state.user) return state.currentRoute = '/login';

            switch(state.currentRoute) {
                case '/login': app.innerHTML = `<div style="display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px;"><form class="glass-card" style="width:100%; max-width:380px;" onsubmit="handleAuth(event, true)"><h2 style="font-size:1.6rem; font-weight:800; margin-bottom:6px;">Sign In</h2><p style="color:var(--text-secondary); font-size:0.88rem; margin-bottom:20px;">Manage your serverless bots</p><div class="input-group"><label>Email</label><input type="email" name="email" class="input-control" required></div><div class="input-group"><label>Password</label><input type="password" name="password" class="input-control" required></div><button class="btn btn-primary" style="width:100%;">Sign In <i class="ph ph-arrow-right"></i></button></form></div>`; break;
                case '/register': app.innerHTML = `<div style="display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px;"><form class="glass-card" style="width:100%; max-width:380px;" onsubmit="handleAuth(event, false)"><h2 style="font-size:1.6rem; font-weight:800; margin-bottom:6px;">Create Account</h2><p style="color:var(--text-secondary); font-size:0.88rem; margin-bottom:20px;">Start hosting free bots</p><div class="input-group"><label>Email</label><input type="email" name="email" class="input-control" required></div><div class="input-group"><label>Password</label><input type="password" name="password" class="input-control" required></div><button class="btn btn-primary" style="width:100%;">Create Account <i class="ph ph-arrow-right"></i></button></form></div>`; break;
                case '/dashboard':
                case '/bots': app.innerHTML = wrapApp(`
