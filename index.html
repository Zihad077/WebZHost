<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebzHost — Dynamic Telegram Bot Hosting</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            --bg-dark: #030712;
            --bg-card: rgba(17, 24, 39, 0.6);
            --border: rgba(255, 255, 255, 0.08);
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --primary: #6366f1;
            --cyan: #06b6d4;
            --success: #10b981;
            --danger: #f43f5e;
            --warning: #f59e0b;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 18px;
            --transition: all 0.25s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-primary); min-height: 100vh; overflow-x: hidden; }
        a { text-decoration: none; color: inherit; }
        button { cursor: pointer; border: none; background: none; font-family: inherit; }
        input, select, textarea { font-family: inherit; }

        .glass-card { background: var(--bg-card); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 20px; border-radius: var(--radius-sm); font-weight: 500; font-size: 0.9rem; transition: var(--transition); border: 1px solid transparent; }
        .btn-primary { background: linear-gradient(135deg, var(--primary), #4f46e5); color: white; }
        .btn-secondary { background: rgba(255,255,255,0.05); border-color: var(--border); color: var(--text-primary); }
        .btn-danger { background: rgba(244, 63, 94, 0.1); border-color: rgba(244, 63, 94, 0.2); color: var(--danger); }

        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 0.85rem; font-weight: 500; color: var(--text-secondary); margin-bottom: 8px; }
        .input-control { width: 100%; padding: 12px 16px; background: rgba(0, 0, 0, 0.6); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-primary); font-size: 0.9rem; }
        .code-editor { font-family: 'Fira Code', monospace; font-size: 0.88rem; line-height: 1.6; background: #020617; color: #38bdf8; min-height: 200px; }

        .top-nav { position: fixed; top: 0; left: 0; right: 0; height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 5%; background: rgba(3, 7, 18, 0.8); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); z-index: 100; }
        .logo { font-size: 1.3rem; font-weight: 800; display: flex; align-items: center; gap: 10px; color: #fff; }

        .app-layout { display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 270px; background: rgba(11, 15, 25, 0.9); border-right: 1px solid var(--border); padding: 30px 18px; display: flex; flex-direction: column; }
        .sidebar-link { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: var(--text-secondary); border-radius: var(--radius-sm); margin-bottom: 6px; cursor: pointer; font-size: 0.92rem; }
        .sidebar-link.active { background: rgba(99, 102, 241, 0.12); color: var(--primary); border-right: 3px solid var(--primary); }
        .main-content { flex: 1; overflow-y: auto; padding: 30px 20px; }

        #toast-container { position: fixed; bottom: 30px; right: 30px; z-index: 9999; display: flex; flex-direction: column; gap: 12px; }
        .toast { background: rgba(17, 24, 39, 0.95); border: 1px solid var(--border); padding: 14px 20px; border-radius: var(--radius-md); display: flex; align-items: center; gap: 12px; font-size: 0.9rem; }
        .loader-overlay { position: fixed; inset: 0; background: rgba(3, 7, 18, 0.85); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 9998; }
        .spinner { width: 44px; height: 44px; border: 3px solid rgba(255,255,255,0.08); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error-modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 99999; }
        .error-modal-card { background: #0f172a; border: 2px solid var(--danger); border-radius: var(--radius-lg); padding: 32px; max-width: 550px; width: 100%; text-align: center; }
        .error-modal-body { background: #020617; border: 1px solid rgba(244, 63, 94, 0.3); padding: 16px; border-radius: var(--radius-sm); color: #fca5a5; font-family: 'Fira Code', monospace; font-size: 0.85rem; text-align: left; word-break: break-all; max-height: 200px; overflow-y: auto; margin: 20px 0; }

        @media (max-width: 768px) {
            .app-layout { flex-direction: column; }
            .sidebar { width: 100%; height: auto; padding: 15px; border-right: none; border-bottom: 1px solid var(--border); }
            .main-content { padding: 20px 12px; }
        }
    </style>
</head>
<body>

    <div id="toast-container"></div>
    <div id="loader" class="loader-overlay" style="display:none;"><div class="spinner"></div></div>

    <div id="error-modal" class="error-modal-overlay" style="display:none;">
        <div class="error-modal-card">
            <i class="ph-fill ph-warning-octagon" style="font-size: 3.8rem; color: var(--danger);"></i>
            <h2 id="error-modal-title" style="font-size:1.4rem; font-weight:700; margin-top:12px;">System Error</h2>
            <div id="error-modal-body" class="error-modal-body">Error details...</div>
            <button class="btn btn-danger" style="width:100%; padding:12px;" onclick="closeErrorModal()">Close Window</button>
        </div>
    </div>

    <div id="app"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, query, where, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCJEMrW8FADRRmKD1WSEOsE9lVoOWoxYtU",
            authDomain: "bothostz.firebaseapp.com",
            projectId: "bothostz",
            storageBucket: "bothostz.firebasestorage.app",
            messagingSenderId: "506392978902",
            appId: "1:506392978902:web:7e962842404f5e91d07077"
        };

        const appFirebase = initializeApp(firebaseConfig);
        const auth = getAuth(appFirebase);
        const db = getFirestore(appFirebase);

        const DOMAIN = "https://webzhost.vercel.app";
        const state = { user: null, isAdmin: false, currentRoute: '/', bots: [] };

        window.showBigError = (title, message) => {
            window.toggleLoader(false);
            document.getElementById('error-modal-title').innerText = title;
            document.getElementById('error-modal-body').innerText = message;
            document.getElementById('error-modal').style.display = 'flex';
        };

        window.closeErrorModal = () => {
            document.getElementById('error-modal').style.display = 'none';
            window.toggleLoader(false);
        };

        window.addEventListener('unhandledrejection', (event) => {
            const reason = event.reason ? (event.reason.message || JSON.stringify(event.reason)) : "Unknown Error";
            window.showBigError("Async / Database Error", reason);
        });

        window.onerror = function(msg, url, lineNo) {
            window.showBigError("JavaScript Error", `${msg}\nLine: ${lineNo}`);
            return false;
        };

        // 🎯 DIRECT DATABASE TEST BUTTON
        window.testDatabaseConnection = async () => {
            window.toggleLoader(true);
            try {
                const docRef = await addDoc(collection(db, "test_collection"), {
                    testMessage: "Firebase Connection Successful!",
                    time: serverTimestamp()
                });
                alert("🎉 SUCCESS! Firebase Firestore is Working!\n\nDocument ID: " + docRef.id + "\n\nNow check Firebase Console. You will see 'test_collection' created!");
            } catch (err) {
                window.showBigError("Database Connection Failed", "Error Code: " + (err.code || 'UNKNOWN') + "\nDetails: " + err.message);
            } finally {
                window.toggleLoader(false);
            }
        };

        const codeTemplates = {
            JS: `// JavaScript Bot Logic\nconst text = update.message.text;\nif (text === '/start') {\n    reply("Hello! Welcome to WebzHost JS Engine 🚀");\n} else {\n    reply("You typed: " + text);\n}`,
            PY: `# Python Bot Logic\ntext = update['message']['text']\nif text == '/start':\n    reply("Hello! Welcome to WebzHost Python Engine 🐍")\nelse:\n    reply(f"You typed: {text}")`
        };

        window.showToast = (msg, type = 'success') => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<i class="ph-fill ph-check-circle" style="color:var(--success); font-size:1.3rem;"></i> <span>${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        window.toggleLoader = (show) => document.getElementById('loader').style.display = show ? 'flex' : 'none';
        window.copyText = (text) => { navigator.clipboard.writeText(text); showToast('Copied to clipboard!'); }
        window.navigateTo = (route) => { state.currentRoute = route; render(); window.scrollTo(0, 0); }

        document.body.addEventListener('click', e => {
            const link = e.target.closest('[data-route]');
            if (link) { e.preventDefault(); navigateTo(link.dataset.route); }
        });

        window.handleLangChange = (lang) => {
            const codeEditor = document.getElementById('botCode');
            if (codeEditor) codeEditor.value = codeTemplates[lang];
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                state.user = user;
                await fetchBots();
                if(['/', '/login', '/register'].includes(state.currentRoute)) navigateTo('/dashboard');
            } else {
                state.user = null; state.bots = [];
                if(state.currentRoute !== '/admin-login') navigateTo('/');
            }
            toggleLoader(false);
            render();
        });

        async function fetchBots() {
            if(!state.user) return;
            try {
                const q = query(collection(db, "bots"), where("userId", "==", state.user.uid));
                const snap = await getDocs(q);
                state.bots = [];
                snap.forEach((doc) => state.bots.push({ id: doc.id, ...doc.data() }));
            } catch (err) {
                console.error("Fetch Error:", err);
            }
        }

        window.handleAuth = async (e, isLogin) => {
            e.preventDefault(); toggleLoader(true);
            try {
                if (isLogin) await signInWithEmailAndPassword(auth, e.target.email.value, e.target.password.value);
                else await createUserWithEmailAndPassword(auth, e.target.email.value, e.target.password.value);
                showToast('Welcome!');
            } catch (err) { 
                window.showBigError("Auth Error", err.message);
            } finally {
                toggleLoader(false);
            }
        }

        window.createBot = async (e) => {
            e.preventDefault();
            if (!state.user) return window.showBigError("Auth Missing", "Please log in first.");

            const name = document.getElementById('botName').value.trim();
            const token = document.getElementById('botToken').value.trim();
            const lang = document.getElementById('botLang').value;
            const code = document.getElementById('botCode').value;

            if (!name || !token) return window.showBigError("Input Error", "Name and Token are required.");

            toggleLoader(true);
            try {
                const docRef = await addDoc(collection(db, "bots"), {
                    userId: state.user.uid, name, token, lang, code, status: 'active', createdAt: serverTimestamp()
                });

                const endpoint = lang === 'PY' ? '/api/webhook_python' : '/api/webhook';
                const webhookUrl = `${DOMAIN}${endpoint}?botId=${docRef.id}`;
                
                try { await fetch(`https://api.telegram.org/bot${token}/setWebhook?url=${webhookUrl}`); } catch (tgErr) {}

                showToast('Bot Deployed!');
                await fetchBots();
                navigateTo('/bots');
            } catch (err) {
                window.showBigError("Deploy Failed", err.message);
            } finally {
                toggleLoader(false);
            }
        }

        window.deleteBot = async (id) => {
            if(confirm('Delete bot?')) {
                toggleLoader(true);
                try {
                    await deleteDoc(doc(db, "bots", id));
                    showToast('Deleted');
                    await fetchBots();
                    render();
                } catch(err) {
                    window.showBigError("Delete Error", err.message);
                } finally {
                    toggleLoader(false);
                }
            }
        }

        window.logout = async () => { await signOut(auth); showToast('Logged out'); }

        const wrapApp = (content) => `
            <div class="app-layout">
                <div class="sidebar">
                    <h2 style="margin-bottom:20px;"><i class="ph-fill ph-paper-plane-tilt"></i> WebzHost</h2>
                    <div class="sidebar-link ${state.currentRoute==='/dashboard'?'active':''}" data-route="/dashboard">Overview</div>
                    <div class="sidebar-link ${state.currentRoute==='/bots'?'active':''}" data-route="/bots">My Bots</div>
                    <div class="sidebar-link ${state.currentRoute==='/create'?'active':''}" data-route="/create">Deploy Bot</div>
                    <div style="margin-top:20px;">
                        <button class="btn btn-danger" style="width:100%; font-size:0.8rem;" onclick="testDatabaseConnection()">⚡ Test Database</button>
                    </div>
                    <div style="flex:1;"></div>
                    <div class="sidebar-link" style="color:var(--danger);" onclick="logout()">Sign Out</div>
                </div>
                <div class="main-content">${content}</div>
            </div>
        `;

        function render() {
            const app = document.getElementById('app');
            if(['/dashboard', '/bots', '/create'].includes(state.currentRoute) && !state.user) return state.currentRoute = '/login';

            switch(state.currentRoute) {
                case '/login': app.innerHTML = `<div style="display:flex; justify-content:center; align-items:center; height:100vh;"><form class="glass-card" style="width:320px;" onsubmit="handleAuth(event, true)"><h2>Login</h2><br><input type="email" name="email" class="input-control" placeholder="Email" required><br><br><input type="password" name="password" class="input-control" placeholder="Password" required><br><br><button class="btn btn-primary" style="width:100%;">Login</button></form></div>`; break;
                case '/register': app.innerHTML = `<div style="display:flex; justify-content:center; align-items:center; height:100vh;"><form class="glass-card" style="width:320px;" onsubmit="handleAuth(event, false)"><h2>Register</h2><br><input type="email" name="email" class="input-control" placeholder="Email" required><br><br><input type="password" name="password" class="input-control" placeholder="Password" required><br><br><button class="btn btn-primary" style="width:100%;">Register</button></form></div>`; break;
                case '/dashboard':
                case '/bots': app.innerHTML = wrapApp(`
                    <h2>My Bots</h2><br>
                    <button class="btn btn-primary" data-route="/create">New Bot</button><br><br>
                    ${state.bots.map(b => `<div class="glass-card" style="margin-bottom:10px; display:flex; justify-content:space-between;"><div><h3>${b.name} (${b.lang})</h3><p style="font-size:0.8rem;">${DOMAIN}/api/${b.lang==='PY'?'webhook_python':'webhook'}?botId=${b.id}</p></div><button class="btn btn-danger" onclick="deleteBot('${b.id}')">Delete</button></div>`).join('')}
                `); break;
                case '/create': app.innerHTML = wrapApp(`
                    <h2>Deploy Bot</h2><br>
                    <form class="glass-card" style="max-width:600px;" onsubmit="createBot(event)">
                        <div class="input-group"><label>Bot Name</label><input id="botName" class="input-control" required></div>
                        <div class="input-group"><label>Language</label><select id="botLang" class="input-control" onchange="handleLangChange(this.value)"><option value="JS">JavaScript</option><option value="PY">Python</option></select></div>
                        <div class="input-group"><label>Telegram Token</label><input id="botToken" type="password" class="input-control" required></div>
                        <div class="input-group"><label>Bot Code</label><textarea id="botCode" class="input-control code-editor" required>${codeTemplates.JS}</textarea></div>
                        <button class="btn btn-primary" style="width:100%;">Deploy</button>
                    </form>
                `); break;
                default: app.innerHTML = `<div style="text-align:center; padding-top:100px;"><h1>WebzHost</h1><br><button class="btn btn-primary" data-route="/login">Login</button></div>`;
            }
        }

        window.addEventListener('load', () => toggleLoader(true));
    </script>
</body>
</html>
